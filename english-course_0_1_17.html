q:[{c:1,q:"I get up ___ seven.",o:["at","on","in"],a:0,e:"Точное время → at."},{c:1,q:"I go to the gym ___ a week. (дважды)",o:["two","twice","second"],a:1,e:"twice = дважды."},{c:1,q:"___ do you go to the gym? — Twice a week.",o:["How often","How much","How long"],a:0,e:"How often = как часто."},{c:1,q:"___ breakfast, I go to work. (после)",o:["Before","After","Then"],a:1,e:"after = после."},{c:1,q:"First I have a shower, ___ I have breakfast.",o:["then","before","twice"],a:0,e:"then = потом."},{c:1,q:"She ___ up at six.",o:["wake","wakes","is wake"],a:1,e:"she → wakes."},{t:1,q:"He ___ (finish) work at five.",a:["finishes"],e:"sh → +es."},{t:1,q:"Исправьте: I start the work at nine.",a:["i start work at nine"],e:"start work — без артикля."},{t:1,q:"Исправьте: She go to bed at eleven.",a:["she goes to bed at eleven"],e:"she + goes."},{t:1,q:"Переведите: Как часто ты ходишь в спортзал?",a:["how often do you go to the gym"],e:"How often do you go to the gym?"},{t:1,q:"Переведите: Я иду на работу в восемь.",a:["i go to work at eight"],e:"I go to work at eight."},{t:1,q:"Переведите: Он обычно ложится спать в одиннадцать.",a:["he usually goes to bed at eleven"],e:"he usually goes to bed at eleven."}],
sp:"Расскажите вслух о своём типичном дне от подъёма до сна (10 предложений) со словами first, then, after that, finally. Затем ответьте на How often do you…? про три ваших привычки.",rd:"Maria usually gets up at six. She always has a shower and never skips breakfast. She often goes to work by bus, but sometimes she walks. In the evening she sometimes meets friends. She never goes to bed after midnight. At the weekend she usually sleeps until nine.",rt:"Мария обычно встаёт в шесть. Она всегда принимает душ и никогда не пропускает завтрак. Часто она ездит на работу на автобусе, а иногда ходит пешком. Вечером она иногда встречается с друзьями. Она никогда не ложится спать после полуночи. По выходным она обычно спит до девяти."},
{r:2,t:"Повторение 2: юниты 1–14",
ex:"<p>Это <b>повторение</b>: возвращаем всё, что прошли, чтобы не забывать. Сначала просмотрите таблицу правил, затем пройдите смешанные упражнения. Если ошибаетесь в теме, вернитесь в нужный юнит или откройте его теорию во вкладке «Справочник».</p><div class='wr'><table><tr><th>Юнит</th><th>Главное правило</th></tr><tr><td>1 to be и местоимения</td><td>I am, he/she/it is, we/you/they are; подлежащее обязательно</td></tr><tr><td>2 артикли и мн. число</td><td>a/an — один из многих, the — конкретный; -s/-es/-ies, исключения</td></tr><tr><td>3 Present Simple</td><td>he/she/it + s; don’t/doesn’t + глагол без s; Do/Does в вопросе</td></tr><tr><td>4 can</td><td>can + глагол без to; can’t; вопрос без do</td></tr><tr><td>5 числа и время</td><td>half past, quarter to; at + время, on + день, in + часть дня</td></tr><tr><td>6 there is/are</td><td>is — один, are — несколько; some в утверждении, any в отрицании и вопросе</td></tr><tr><td>7 предлоги места</td><td>in внутри, on на поверхности, at в точке; go home без to</td></tr><tr><td>8 this/that, ’s</td><td>this/these близко, that/those далеко; Tom’s, students’, children’s</td></tr><tr><td>9 Present Continuous</td><td>am/is/are + V-ing; действие сейчас; глаголы состояния без -ing</td></tr><tr><td>10 еда, much/many</td><td>неисчисляемые без a и без мн. числа; much/many; I’d like для заказа</td></tr><tr><td>11 дом, have/has</td><td>she has; doesn’t have; have got (брит.); прилагательное перед существительным, не меняется: a big red car</td></tr><tr><td>12 семья, внешность</td><td>is — рост, has — волосы; look like — как выглядит, be like — какой по характеру; возраст: He is 40</td></tr><tr><td>13 город, команды</td><td>Turn left; Don’t + глагол; Let’s + глагол; along, across, past; How do I get to…?</td></tr><tr><td>14 распорядок, частота</td><td>always…never перед глаголом, после to be; once / twice a week; How often…?; never без not</td></tr></table></div><h3>Тезисы по всем темам</h3><ul><li><b>Порядок слов:</b> подлежащее → сказуемое → дополнение → место → время: <i>I work in a bank every day.</i> Подлежащее обязательно.</li><li><b>to be:</b> am/is/are; отрицание + not; вопрос — глагол вперёд. Профессия, состояние, возраст, место: <i>She is a doctor. I’m 28.</i></li><li><b>Местоимения:</b> I/you/he/she/it/we/they (до глагола) · me/you/him/her/it/us/them (после глагола и предлога) · my/your/his/her/its/our/their (перед существительным) · mine/yours/hers (без него).</li><li><b>Артикли:</b> a/an — один из многих, первое упоминание, профессия; the — известный и единственный; без артикля — мн. число и неисчисляемые в общем смысле, имена, города, my car.</li><li><b>Мн. число:</b> +s · s/x/ch/sh/o → +es · согласная+y → ies · f/fe → ves · man–men, woman–women, child–children, person–people.</li><li><b>Present Simple:</b> привычки и факты; he/she/it + s; don’t/doesn’t + глагол без s; Do/Does…?; always, usually, often, sometimes, never стоят перед глаголом и после to be.</li><li><b>Present Continuous:</b> am/is/are + V-ing; действие сейчас; не употребляется с know, like, want, love, need, understand.</li><li><b>can:</b> can + глагол без to; одинаков для всех лиц; can’t; вопрос Can you…? без do; просьба и разрешение.</li><li><b>Время и числа:</b> o’clock, half past, quarter past/to; 1–30 минут — past, 31–59 — to; at 7, on Monday, in the morning; thirteen ≠ thirty.</li><li><b>Предлоги места:</b> in (внутри), on (на поверхности), at (точка); in front of, behind, opposite, next to, above, under; go home без to.</li><li><b>there is / there are:</b> is — один, are — несколько; some в утверждении, any в отрицании и вопросе; How many…?</li><li><b>this/that/these/those, ’s, whose:</b> близко/далеко; Tom’s, students’, children’s; Whose bag is this?</li><li><b>Исчисляемые и неисчисляемые:</b> a/an и мн. число только у исчисляемых; much — неисчисляемые, many — исчисляемые, a lot of — оба; a glass of water; I’d like для вежливого заказа.</li><li><b>Вопросы:</b> вопросительное слово (what, who, where, when, why, how, which, whose) + вспомогательный (am/is/are, do/does, can) + подлежащее + глагол.</li><li><b>have / has и прилагательные:</b> she has, doesn’t have, Does she have…?; have got — британский вариант; прилагательное стоит перед существительным и не меняется; размер → цвет.</li><li><b>Семья и внешность:</b> is tall, has long hair; What does she look like? / What is she like?; возраст: He is forty, не has.</li><li><b>Город:</b> команда — глагол без to и без подлежащего; Don’t turn; Let’s go; along, across, past, through; on foot; How far is it?</li><li><b>Частота:</b> always, usually, often, sometimes, rarely, never; перед глаголом, после to be; never не сочетается с not; How often do you…?</li></ul><div class='tip'><b>Как повторять:</b> проходите повторение через 2–3 дня после юнитов, затем ещё раз через неделю. Задания, в которых ошиблись, перечитайте вслух.</div>",

function ref0(){return`<div class="c"><h2>Справочник</h2><h3>Навигатор: где какая тема</h3><p>Каждая тема описана <b>один раз</b>, в своём разделе. Ниже — где её искать. Общие разделы справочника (порядок слов, предлоги, фразовые глаголы, клише) собирают то, что не вмещается в один юнит.</p><div class="wr"><table><tr><th>Тема</th><th>Раздел</th></tr><tr><td>Личные местоимения и их формы, глагол to be, сокращения, вопросительные слова</td><td>Юнит 1</td></tr><tr><td>Артикли a / an / the, множественное число</td><td>Юнит 2</td></tr><tr><td>Present Simple, do / does</td><td>Юнит 3</td></tr><tr><td>can, could, may, просьбы и разрешения</td><td>Юнит 4</td></tr><tr><td>Числа, даты, время, at / on / in для времени</td><td>Юнит 5</td></tr><tr><td>there is / there are, some / any / no</td><td>Юнит 6</td></tr><tr><td>Предлоги места, адреса, этажи</td><td>Юнит 7</td></tr><tr><td>this / that, ’s, whose</td><td>Юнит 8</td></tr><tr><td>Present Continuous, выбор между Simple и Continuous</td><td>Юнит 9</td></tr><tr><td>Исчисляемые и неисчисляемые, much / many, would like, заказ</td><td>Юнит 10</td></tr><tr><td>have / has / have got, прилагательные, цвета</td><td>Юнит 11</td></tr><tr><td>Семья, возраст, внешность, look like / be like</td><td>Юнит 12</td></tr><tr><td>Команды, Let’s, указание пути, порядковые числа, британские и американские слова</td><td>Юнит 13</td></tr><tr><td>Распорядок дня, слова частоты</td><td>Юнит 14</td></tr></table></div><h3>Порядок слов: сквозная схема</h3><p>Английское предложение строится по жёсткой цепочке. Каждый юнит объясняет своё звено, а здесь они собраны в одну схему.</p><div class="wr"><table><tr><th>Звено</th><th>Что ставим</th><th>Где подробно</th></tr><tr><td>1</td><td>вопросительное слово (в вопросе)</td><td>юнит 1</td></tr><tr><td>2</td><td>вспомогательный глагол (do / does, am / is / are, can)</td><td>юниты 3, 4, 9</td></tr><tr><td>3</td><td>подлежащее — всегда выражено</td><td>юнит 1</td></tr><tr><td>4</td><td>слово частоты (перед глаголом, после to be)</td><td>юнит 14</td></tr><tr><td>5</td><td>глагол и дополнение (прилагательное перед существительным)</td><td>юниты 3, 11</td></tr><tr><td>6</td><td>место, затем время</td><td>юниты 7, 5</td></tr></table></div><p>Пример по звеньям: <i>I (3) usually (4) study (5) English (5) at home (6) in the evening (6).</i> Вопрос: <i>Where (1) do (2) you (3) usually (4) study (5)?</i> Русский порядок слов свободный, а английский почти нет: перестановка меняет смысл или делает фразу неверной.</p><h3>Клише для общения</h3><p>Фразы по ситуациям встречаются и в юнитах: знакомство (1), время (5), заказ (10), дорога (13). Здесь — набор для общения.</p><div class="wr"><table><tr><th>Ситуация</th><th>Фраза</th></tr><tr><td>Приветствие</td><td>Hi! / Hello! / Good morning!</td></tr><tr><td>Знакомство</td><td>Nice to meet you. · Where are you from?</td></tr><tr><td>Просьба</td><td>Could you help me, please?</td></tr><tr><td>Не понял</td><td>Sorry, could you repeat that? · Could you speak more slowly?</td></tr><tr><td>Благодарность</td><td>Thanks a lot! — You’re welcome.</td></tr><tr><td>Туризм</td><td>Where is the nearest metro station? · How much is it? · I’d like a coffee, please.</td></tr></table></div><h3>Основные конструкции с предлогами</h3><p>Предлоги места и движения: юниты 7 и 13. Здесь — только сочетания «глагол или прилагательное + предлог».</p><div class="wr"><table><tr><th>Конструкция</th><th>Значение</th><th>Пример</th></tr><tr><td>listen <b>to</b></td><td>слушать</td><td>I listen to music. (по-русски без предлога!)</td></tr><tr><td>look <b>at</b></td><td>смотреть на</td><td>Look at this!</td></tr><tr><td>wait <b>for</b></td><td>ждать</td><td>I’m waiting for a bus.</td></tr><tr><td>talk <b>to</b> / <b>about</b></td><td>говорить с / о</td><td>She talks to Tom about work.</td></tr><tr><td>think <b>about</b></td><td>думать о</td><td>I think about my family.</td></tr><tr><td>go <b>to</b> (но go home)</td><td>идти в, на</td><td>I go to school. I go home.</td></tr><tr><td>arrive <b>in</b> + город / <b>at</b> + место</td><td>приезжать</td><td>arrive in London, arrive at the station</td></tr><tr><td>be good <b>at</b></td><td>хорошо уметь</td><td>He is good at English.</td></tr><tr><td>be interested <b>in</b></td><td>интересоваться</td><td>I’m interested in music.</td></tr><tr><td>be afraid <b>of</b></td><td>бояться</td><td>She is afraid of dogs.</td></tr><tr><td>be <b>from</b></td><td>быть родом из</td><td>I’m from Russia.</td></tr><tr><td><b>by</b> bus / car / train / plane, <b>on</b> foot</td><td>на транспорте, пешком</td><td>I go to work by bus.</td></tr></table></div><h3>Фразовые глаголы (глагол + частица меняет значение)</h3><p>Примеры с get up, wake up: юнит 14; look at, wait for: юниты 9 и 13. Здесь — общая система и таблица по глаголам.</p><p>Фразовый глагол — это глагол + частица (<b>on, off, up, down, out, in, away, back</b>). Значение часто нельзя угадать по частям: <i>look</i> (смотреть) + <i>for</i> = искать. Одно и то же сочетание может иметь несколько значений: <i>take off</i> = снимать (одежду) и взлетать (самолёт).</p><ul><li><b>Разделяемые</b> (есть дополнение, его можно поставить между): <i>put on the jacket = put the jacket on</i>. <b>Местоимение — только между:</b> <i>put it on</i> (не «put on it»).</li><li><b>Неразделяемые</b> (дополнение только после): <i>look after the children → look after them</i>.</li><li><b>Без дополнения:</b> <i>get up, sit down, come back, wake up</i>.</li><li><b>Три слова:</b> <i>look forward to, put up with, get on with</i> — дополнение в конце: <i>I look forward to the weekend.</i></li></ul><div class="wr"><table><tr><th>Глагол</th><th>Сочетания и значения</th></tr><tr><td><b>put</b> (класть)</td><td>put on — надевать (<i>put on a coat</i>) · put off — откладывать · put out — тушить · put away — убирать на место · put down — положить; записать · put up with — мириться</td></tr><tr><td><b>get</b></td><td>get up — вставать · get on / off — садиться в / выходить из транспорта (bus, train) · get in / out of — садиться в / выходить из машины, такси · get back — возвращаться · get on with — ладить с · get over — оправиться</td></tr><tr><td><b>take</b> (брать)</td><td>take off — снимать (одежду); взлетать (самолёт) · take out — вынимать; вести куда-то · take up — начать заниматься (хобби) · take back — вернуть · take care of — заботиться</td></tr><tr><td><b>turn</b> (поворачивать)</td><td>turn on / off — включать / выключать · turn up / down — сделать громче, ярче / тише · turn around — развернуться</td></tr><tr><td><b>look</b> (смотреть)</td><td>look at — смотреть на · look for — искать · look after — присматривать, заботиться · look up — искать в словаре · look forward to — ждать с нетерпением · look out! — осторожно!</td></tr><tr><td><b>go</b></td><td>go on — продолжать · go out — выходить гулять · go back — вернуться · go away — уходить, уезжать · go up / down — подниматься / спускаться</td></tr><tr><td><b>come</b></td><td>come in — входить · come back — возвращаться · come on — давай! · come out — выходить (книга, фильм) · come from — быть родом из</td></tr><tr><td><b>give</b> (давать)</td><td>give up — бросить, сдаться · give back — вернуть · give away — раздать</td></tr><tr><td><b>другие</b></td><td>wake up — просыпаться · sit down — садиться · stand up — вставать · pick up — поднять; забрать (человека) · find out — узнать · check in / out — регистрироваться / выписываться · try on — примерить · throw away — выбросить · hurry up — поторопиться · slow down — замедлиться · call back — перезвонить · fill in — заполнить (форму) · carry on — продолжать</td></tr></table></div><p><i>Примеры:</i> <i>Turn off the light. = Turn the light off. = Turn it off.</i> · <i>Get on the bus at the station.</i> · <i>Can you look after my dog?</i> · <i>I give up!</i> Список будет пополняться по мере прохождения юнитов.</p></div>`}
