{t:"A1 · Юнит 1: Знакомство и глагол to be",
ex:"<p>В русском в настоящем времени глагола «быть» нет: «Я студент». В английском он <b>обязателен</b>: <b>I am</b> a student.</p><div class='wr'><table><tr><th>Кто</th><th>Форма</th><th>Кратко</th><th>Отрицание</th></tr><tr><td>I</td><td>am</td><td>I’m</td><td>I’m not</td></tr><tr><td>he / she / it</td><td>is</td><td>he’s</td><td>isn’t</td></tr><tr><td>you / we / they</td><td>are</td><td>you’re</td><td>aren’t</td></tr></table></div><p><b>Вопрос:</b> глагол выходит вперёд. <i>She is from Spain → Is she from Spain?</i> Ответы: <i>Yes, she is. / No, she isn’t.</i></p><div class='tip err'><b>Частая ошибка:</b> «I student», «She from Spain». Всегда добавляйте am/is/are.</div><h3>Личные местоимения: кто делает действие</h3><div class='wr'><table><tr><th>Лицо</th><th>Один</th><th>Несколько</th></tr><tr><td>1-е (говорящий)</td><td><b>I</b> — я</td><td><b>we</b> — мы</td></tr><tr><td>2-е (собеседник)</td><td><b>you</b> — ты / вы</td><td><b>you</b> — вы</td></tr><tr><td>3-е (о ком-то)</td><td><b>he</b> (он), <b>she</b> (она), <b>it</b> (оно)</td><td><b>they</b> — они</td></tr></table></div><ul><li><b>I</b> всегда пишется с большой буквы, даже в середине предложения.</li><li><b>Подлежащее обязательно.</b> В русском можно сказать «Живу в Москве», в английском нельзя: <i>I live in Moscow.</i> Нет подлежащего — нет предложения.</li><li><b>you</b> — и «ты», и «вы», и один человек, и много. Глагол всегда <i>are</i>: <i>You are kind</i> (даже если «ты» один).</li><li><b>he / she</b> — только люди (и иногда домашние животные, которых мы знаем). Вместо имени: <i>Anna is a teacher → She is a teacher.</i></li><li><b>it</b> — предметы, животные, явления и погода: <i>It is a book. It is cold. It is 5 o’clock.</i> Людей называть it нельзя.</li><li><b>they</b> — несколько людей, предметов или животных: <i>Tom and Anna → they; books → they.</i> Tom and I → <b>we</b>.</li></ul><h3>Сокращения: когда можно, когда нельзя</h3><p>В речи и неформальном письме: <i>I’m, he’s, they’re, isn’t</i>. <b>Нельзя сокращать</b> в конце короткого утвердительного ответа: <i>Yes, I am</i> (не <i>Yes, I’m</i>). Отрицательное сокращается свободно: <i>No, he isn’t.</i></p><h3>Местоимения в других ролях</h3><p>Если местоимение стоит <b>после глагола или предлога</b>, нужна объектная форма: <i>I like <b>her</b>. Come with <b>us</b>.</i> Перед существительным нужна притяжательная: <i>my book, her car</i>. Полная таблица всех форм — во вкладке «Справочник».</p><div class='tip err'><b>Путаница:</b> <i>its</i> (его/её, о предмете) и <i>it’s</i> (= it is). Проверка: подставьте «it is» — получается смысл? Значит it’s.</div><h3>Вопросительные слова</h3><div class='wr'><table><tr><th>Слово</th><th>Значение</th><th>Пример</th></tr><tr><td><b>what</b></td><td>что, какой</td><td>What is your name? — Как тебя зовут? (буквально: «Что есть твоё имя?»)</td></tr><tr><td><b>who</b></td><td>кто</td><td>Who is she? — Кто она?</td></tr><tr><td><b>where</b></td><td>где, куда</td><td>Where are you? — Где ты?</td></tr><tr><td><b>when</b></td><td>когда</td><td>When is the lesson? — Когда урок?</td></tr><tr><td><b>why</b></td><td>почему</td><td>Why are you tired? — Почему ты устал?</td></tr><tr><td><b>how</b></td><td>как</td><td>How are you? — Как дела? (буквально: «Как ты есть?»)</td></tr><tr><td><b>which</b></td><td>какой из, который</td><td>Which book is it? — Какая это книга (из этих)?</td></tr><tr><td><b>whose</b></td><td>чей</td><td>подробно в юните 8</td></tr></table></div><p><b>Как строить вопрос с to be:</b> вопросительное слово + am/is/are + подлежащее. <i>Where (где) + are (есть) + you (ты)? → Где ты?</i> Вопросительное слово всегда стоит <b>первым</b>. Ошибка: «Where you are?» — верно: <i>Where are you?</i> Возраст: <i>How old are you?</i> (буквально «Как стар ты есть?») — <i>I’m 28.</i></p><h3>Разбор фраз по словам</h3><div class='wr'><table><tr><th>Фраза</th><th>По словам</th><th>Смысл</th></tr><tr><td>Nice to meet you</td><td>nice (приятно) + to meet (встретить) + you (тебя)</td><td>Приятно познакомиться</td></tr><tr><td>Where are you from?</td><td>where (где) + are (есть) + you (ты) + from (из)</td><td>Откуда ты?</td></tr><tr><td>I’m fine, thanks</td><td>I’m (я есть) + fine (хорошо) + thanks (спасибо)</td><td>Я в порядке, спасибо</td></tr><tr><td>And you?</td><td>and (а) + you (ты)</td><td>А ты?</td></tr></table></div>",

dt:"— Привет! Я Том. Как тебя зовут?<br>— Здравствуй, Том. Меня зовут Анна. Приятно познакомиться.<br>— Мне тоже приятно. Откуда ты?<br>— Я из России. А ты?<br>— Я из Канады.",rt:"Привет! Меня зовут Ольга. Мне 28 лет. Я из Казани, но сейчас я в Берлине. Я учитель. Мои друзья ‑ Макс и Лена. Они из Германии. Макс врач, а Лена студентка. Мы счастливы в Берлине. Это большой город.",sp:"Скажите вслух и запишите на диктофон: имя, откуда вы, как дела (5 предложений). Прослушайте и сравните с диалогом.",rd:"Hi! My name is Olga. I’m 28. I’m from Kazan, but now I’m in Berlin. I’m a teacher. My friends are Max and Lena. They are from Germany. Max is a doctor and Lena is a student. We are happy in Berlin. It is a big city."},
{t:"A1 · Юнит 2: Артикли a/an/the и множественное число",
ex:"<p>В русском артиклей нет, в английском они есть почти всегда перед существительным.</p><ul><li><b>a</b> + согласный звук: <i>a car, a book</i></li><li><b>an</b> + гласный звук: <i>an apple, an hour</i> (важен звук, не буква!)</li><li><b>the</b> — конкретный или уже известный предмет: <i>I have a car. The car is red.</i></li></ul><p><b>Множественное число:</b> +s (<i>books</i>); после s, x, ch, sh +es (<i>boxes</i>); согласная+y → ies (<i>city → cities</i>). Исключения: <i>man → men, woman → women, child → children, person → people</i>.</p><h3>Как выбрать артикль: пять вопросов</h3><p>В русском артиклей нет, поэтому их нужно <b>осознанно выбирать</b>. Задайте себе вопросы по порядку:</p><div class='wr'><table><tr><th>Вопрос</th><th>Ответ</th><th>Пример</th></tr><tr><td>1. Это существительное можно посчитать?</td><td>нет → без a/an</td><td>I drink water. (не a water)</td></tr><tr><td>2. Предмет один из многих и новый для собеседника?</td><td>a / an</td><td>I have a dog.</td></tr><tr><td>3. Собеседник знает, о каком речь (уже упоминали, он один, ясно из ситуации)?</td><td>the</td><td>The dog is big. Open the door, please.</td></tr><tr><td>4. Речь о множестве вообще?</td><td>без артикля</td><td>Dogs are friendly.</td></tr><tr><td>5. Это имя, город, страна, язык?</td><td>без артикля</td><td>Anna lives in Russia and speaks English.</td></tr></table></div><h3>a или an — по звуку, а не по букве</h3><p><b>an</b> стоит перед <b>гласным звуком</b>: <i>an apple, an umbrella, an hour</i> (h не читается). <b>a</b> — перед согласным звуком: <i>a university</i> (читается «юниверсити», начинается на звук [j]), <i>a European</i>, <i>a one-way ticket</i>.</p><h3>Где артикль не нужен</h3><ul><li>после притяжательных слов: <i>my car, her bag</i> (не <i>the my car</i>);</li><li>в устойчивых выражениях: <i>at home, at work, by bus, go to bed</i>;</li><li>с большинством названий стран и городов: <i>Russia, Paris</i>. Исключения: <i>the UK, the USA</i> (названия из нескольких частей — с the).</li></ul><h3>Множественное число: звук и исключения</h3><p>Окончание читается как [s] (<i>books</i>), [z] (<i>dogs, days</i>) или [ɪz] (<i>boxes, watches</i>). <b>Не меняются:</b> <i>sheep</i> (овца и овцы), <i>fish</i>. <b>Всегда во мн. числе:</b> <i>trousers, jeans, glasses, scissors</i> (брюки, джинсы, очки, ножницы): <i>These jeans are new.</i> Слово <b>people</b> — тоже множественное: <i>People are kind</i> (не <i>People is</i>, не <i>peoples</i>).</p><p>Ещё ошибки: «a information» (information — неисчисляемое, юнит 10), «the Russia», «an university».</p><div class='tip err'><b>Частая ошибка:</b> «I have car». Нужно: <i>I have a car.</i> А a/an не ставится во множественном числе: <i>I have two cars.</i></div><h3>Когда какой артикль</h3><ul><li><b>a / an</b> — один из многих, первое упоминание, профессия: <i>She is <b>a</b> doctor. I have <b>a</b> dog.</i> Только с исчисляемыми в единственном числе.</li><li><b>the</b> — собеседник знает, о каком предмете речь; второе упоминание; единственный в своём роде (<i>the sun, the moon</i>); превосходная степень (<i>the best</i>): <i>Close <b>the</b> door.</i></li><li><b>Без артикля</b> — множественное и неисчисляемое в общем смысле (<i>I like dogs, I like music</i>), имена и большинство стран и городов (<i>Anna, Spain, Paris</i>), языки, приёмы пищи (<i>have breakfast</i>), после my/your/his (<i>my car</i>, не <i>a my car</i>).</li></ul><h3>Правописание множественного числа</h3><div class='wr'><table><tr><th>Правило</th><th>Пример</th></tr><tr><td>обычно +s</td><td>book → books</td></tr><tr><td>s, x, ch, sh, o → +es</td><td>box → boxes, bus → buses</td></tr><tr><td>согласная + y → ies</td><td>city → cities (но day → days)</td></tr><tr><td>f / fe → ves</td><td>knife → knives</td></tr><tr><td>исключения</td><td>man → men, woman → women, child → children, person → people</td></tr></table></div><p>Звучание -s: после глухих звуков [s] (<i>books</i>), после звонких [z] (<i>bags</i>), после s, x, ch [ɪz] (<i>boxes</i>).</p>",

dt:"— Что это?<br>— Это телефон.<br>— Это твой телефон?<br>— Нет. Это телефон друга. Телефон лежит в сумке.",sp:"Оглядитесь и назовите вслух 10 предметов с артиклем: a table, a phone, an apple… Затем скажите то же во множественном числе.",rd:"I have a flat in Kazan. It is small. In the kitchen I have a table and two chairs. On the table I have an apple, a book and three pens. I have a cat. The cat is white. It likes boxes, but I don’t have a box.",rt:"У меня квартира в Казани. Она маленькая. На кухне у меня стол и два стула. На столе у меня яблоко, книга и три ручки. У меня есть кошка. Кошка белая. Она любит коробки, но у меня нет коробки."},
{t:"A1 · Юнит 3: Present Simple — привычки и факты",
ex:"<p><b>Present Simple</b> (простое настоящее) описывает то, что происходит <b>регулярно</b> или <b>всегда верно</b>: привычки, распорядок, факты. <i>I get up at seven.</i> — Я встаю в семь. <i>Water boils at 100°.</i> — Вода кипит при 100°.</p><h3>Утверждение</h3><div class='wr'><table><tr><th>Кто</th><th>Форма</th><th>Пример</th></tr><tr><td>I / you / we / they</td><td>глагол без изменений</td><td>I work. — Я работаю.</td></tr><tr><td>he / she / it</td><td>глагол + <b>s</b></td><td>She works. — Она работает.</td></tr></table></div><p><b>Правописание -s:</b> обычно +s (<i>works, reads</i>); после s, sh, ch, x, o → +es (<i>watches, goes</i>); согласная + y → ies (<i>study → studies</i>); особый случай: <i>have → has</i>.</p><h3>Отрицание и вопрос: помощник do / does</h3><div class='wr'><table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr><tr><td>Отрицание</td><td>I <b>don’t</b> (do not) work.</td><td>She <b>doesn’t</b> (does not) work.</td></tr><tr><td>Вопрос</td><td><b>Do</b> you work?</td><td><b>Does</b> she work?</td></tr><tr><td>Краткий ответ</td><td>Yes, I do. / No, I don’t.</td><td>Yes, she does. / No, she doesn’t.</td></tr></table></div><ul><li>Для отрицания и вопроса нужен помощник <b>do</b> (для he/she/it — <b>does</b>). Он сам «забирает» окончание -s, поэтому основной глагол остаётся <b>без -s</b>: <i>She doesn’t work</i> (не <i>works</i>), <i>Does she work?</i></li><li>Вопросительное слово ставится в начало: <i>Where do you live?</i> — Где ты живёшь? <i>What does he do?</i> — Кем он работает?</li></ul><h3>Слова-маркеры частоты</h3><p><b>always</b> (всегда), <b>usually</b> (обычно), <b>often</b> (часто), <b>sometimes</b> (иногда), <b>never</b> (никогда), <b>every day</b> (каждый день). Место этих слов в предложении и отрицание с ними разобраны в юните 14.</p><h3>Почему -s только у he / she / it</h3><p>В русском глагол меняется почти для каждого лица (<i>я пишу, ты пишешь, он пишет</i>). В английском от старой системы осталась одна форма: <b>третье лицо единственного числа</b> (he, she, it и любое одно существительное: <i>Tom works, the bus stops</i>). Для всех остальных лиц глагол не меняется. Правило: <i>один человек или предмет, о котором говорим</i> → глагол с -s.</p><h3>Как читается окончание</h3><div class='wr'><table><tr><th>Звук</th><th>После чего</th><th>Примеры</th></tr><tr><td>[s]</td><td>глухих согласных</td><td>works, stops</td></tr><tr><td>[z]</td><td>звонких согласных и гласных</td><td>reads, plays, goes</td></tr><tr><td>[ɪz]</td><td>s, sh, ch, x, z</td><td>watches, washes, mixes</td></tr></table></div><p>К правилам правописания добавьте: после <b>o</b> тоже -es (<i>go → goes, do → does</i>).</p><h3>Когда Present Simple, а когда НЕТ</h3><div class='wr'><table><tr><th>Используем</th><th>Пример</th></tr><tr><td>привычки и распорядок</td><td>I start work at nine.</td></tr><tr><td>постоянные факты</td><td>The sun rises in the east.</td></tr><tr><td>постоянное состояние</td><td>She lives in Rome. I know him.</td></tr><tr><td>расписания</td><td>The train leaves at six.</td></tr></table></div><p><b>Не используем</b>, когда действие идёт <b>прямо сейчас</b>: «Сейчас он спит» — <i>He is sleeping</i> (юнит 9), а не <i>He sleeps now</i>.</p><h3>Вопрос к подлежащему</h3><p>Если спрашиваем <b>кто</b> совершает действие, do/does <b>не нужен</b>: <i>Who lives here?</i> — Кто здесь живёт? <i>Who works at the bank?</i> — Tom does. Глагол остаётся с -s, как после he/she: <i>who</i> считается за одно лицо.</p><div class='tip err'><b>Ошибки русскоговорящих:</b> «Who does live here?» (нужно Who lives here?), «She is always late» переводят как «She always is late» (always после is). В русском отрицание «не» ставится перед глаголом, а в английском оно прикрепляется к <b>do/does</b>, и глагол остаётся без -s.</div>",
v:[["get up","вставать"],["eat","есть, кушать"],["drink","пить"],["go","идти, ехать"],["watch","смотреть"],["read","читать"],["study","учиться, изучать"],["play","играть"],["cook","готовить"],["breakfast","завтрак"],["always","всегда"],["never","никогда"]],
ph:[["I get up at seven.","Я встаю в семь."],["She doesn’t drink coffee.","Она не пьёт кофе."],["Do you speak English?","Ты говоришь по-английски?"],["What do you do?","Кем вы работаете?"],["He usually goes to work by bus.","Он обычно ездит на работу на автобусе."],["Where does she live?","Где она живёт?"]],
dl:"— What do you do, Anna?<br>— I’m a teacher. I work at a school.<br>— Do you like it?<br>— Yes, I do. I always get up at seven and I usually eat breakfast at home.<br>— Does your husband work too?<br>— No, he doesn’t. He studies at university.",
dt:"— Кем ты работаешь, Анна?<br>— Я учитель. Я работаю в школе.<br>— Тебе нравится?<br>— Да. Я всегда встаю в семь и обычно завтракаю дома.<br>— Твой муж тоже работает?<br>— Нет. Он учится в университете.",
q:[{c:1,q:"She ___ in London.",o:["live","lives","is live"],a:1,e:"she → глагол + s."},{c:1,q:"He ___ tea. (он не пьёт чай)",o:["don’t drink","doesn’t drink","doesn’t drinks"],a:1,e:"doesn’t + глагол без s."},{c:1,q:"___ you speak English?",o:["Do","Does","Are"],a:0,e:"you → Do."},{c:1,q:"Does she ___ English?",o:["speak","speaks","speaking"],a:0,e:"После does глагол без s."},{c:1,q:"Выберите верный порядок слов:",o:["She always is late.","She is always late.","Always she is late."],a:1,e:"После to be: is always."},{t:1,q:"My brother ___ (watch) TV every day.",a:["watches"],e:"watch → watches."},{t:1,q:"She ___ (study) at university.",a:["studies"],e:"y → ies."},{t:1,q:"Исправьте: He don’t like tea.",a:["he doesn’t like tea","he does not like tea"],e:"he → doesn’t."},{t:1,q:"Исправьте: Does she works here?",a:["does she work here"],e:"После does без s."},{t:1,q:"Переведите: Они не живут в Берлине.",a:["they don’t live in berlin","they do not live in berlin"],e:"They don’t live in Berlin."},{t:1,q:"Переведите вопрос: Где ты живёшь?",a:["where do you live"],e:"Where + do + you + live?"},{t:1,q:"Does Tom play football? Ответьте «да»: Yes, ___.",a:["he does"],e:"Yes, he does."}],
sp:"Расскажите вслух о своём дне: 6 предложений со словами always, usually, never. Затем задайте себе 3 вопроса: Do you…? Where do you…? What do you do?",rd:"Anna works in a shop. She gets up at seven o’clock. She drinks tea and eats bread for breakfast. She doesn’t drink coffee. Her brother Tom doesn’t work. He studies at university. He plays football on Saturday. Anna and Tom don’t watch TV in the morning.",rt:"Анна работает в магазине. Она встаёт в семь часов. На завтрак она пьёт чай и ест хлеб. Она не пьёт кофе. Её брат Том не работает. Он учится в университете. По субботам он играет в футбол. Анна и Том не смотрят телевизор по утрам."},
{t:"A1 · Юнит 4: can — уметь, мочь, просить",
ex:"<p><b>can</b> — особый (модальный) глагол. Он значит «<b>уметь</b>», «<b>мочь</b>», «<b>можно ли</b>». Три основные ситуации:</p><ul><li><b>Умение:</b> <i>I can swim.</i> — Я умею плавать.</li><li><b>Возможность:</b> <i>I can help you.</i> — Я могу вам помочь.</li><li><b>Просьба или разрешение:</b> <i>Can I open the window?</i> — Можно открыть окно? <i>Can you help me?</i> — Вы можете мне помочь?</li></ul><h3>Правила</h3><div class='wr'><table><tr><th>Форма</th><th>Пример</th><th>Перевод</th></tr><tr><td>Утверждение</td><td>She <b>can</b> sing.</td><td>Она умеет петь.</td></tr><tr><td>Отрицание</td><td>She <b>can’t</b> (cannot) sing.</td><td>Она не умеет петь.</td></tr><tr><td>Вопрос</td><td><b>Can</b> she sing?</td><td>Она умеет петь?</td></tr><tr><td>Краткий ответ</td><td>Yes, she <b>can</b>. / No, she <b>can’t</b>.</td><td>Да. / Нет.</td></tr></table></div><ul><li><b>can одинаково для всех лиц.</b> Окончания -s нет: <i>he can</i>, не <i>he cans</i>.</li><li>После can стоит глагол <b>без to</b>: <i>I can swim</i>, не <i>I can to swim</i>.</li><li>Помощник do/does <b>не нужен</b>: вопрос образуется перестановкой: <i>Can you drive?</i>, не <i>Do you can drive?</i></li><li>Отрицание пишется <b>can’t</b> или слитно <b>cannot</b> (но не «can not»).</li><li>Прошедшее время: <b>could</b>. <i>I could swim when I was five.</i> Вежливая просьба: <i>Could you help me?</i> звучит мягче, чем <i>Can you…?</i></li></ul><h3>Умею и могу: в английском одно слово</h3><p>Русский различает «<b>умею</b>» и «<b>могу</b>», а английский использует <b>can</b> для обоих: <i>I can swim</i> (умею), <i>I can come at six</i> (могу, у меня есть возможность). Но «знать язык» — это <b>know</b>: <i>I know English</i>, а «могу говорить» — <i>I can speak English</i>.</p><h3>Просьбы: can, could, may</h3><div class='wr'><table><tr><th>Фраза</th><th>Тон</th><th>Когда</th></tr><tr><td>Can I open the window?</td><td>обычный</td><td>друзья, коллеги, кафе</td></tr><tr><td>Could I open the window?</td><td>вежливый</td><td>незнакомые люди, просьбы</td></tr><tr><td>May I open the window?</td><td>формальный</td><td>начальство, официальная обстановка</td></tr></table></div><p>Ответ на просьбу: <i>Sure. / Of course. / Sorry, I can’t.</i></p><h3>Can с глаголами восприятия</h3><p>Глаголы <b>see, hear, smell, taste</b> обычно идут с can и без Continuous: <i>I can see a bird.</i> — Я вижу птицу. <i>I can hear music.</i> — Я слышу музыку. Не говорим «I am seeing a bird».</p><h3>Как звучит can</h3><p>В середине фразы <b>can</b> почти не ударяется и звучит слабо [kən]: <i>I can swim</i>. В коротком ответе — полно: <i>Yes, I can</i> [kæn]. Отрицание <b>can’t</b> всегда ударное и чёткое, поэтому на слух can и can’t различают именно по <b>ударению и долготе гласного</b>, а не по слышимому «t». Тренируйте на парах: <i>I can swim — I can’t swim</i>.</p><p>Ещё ошибки: «I can swim good» (нужно well — наречие), «Can you to help me?», «I don’t can find it» (нужно I can’t find it).</p><h3>Можно и нельзя</h3><p>Can и can’t выражают и разрешение: <i>You can park here.</i> — Здесь можно парковаться. <i>You can’t smoke here.</i> — Здесь нельзя курить. Так пишут на табличках и говорят в общественных местах. Для запрета в команде есть ещё <i>Don’t…</i> (юнит 13): <i>Don’t park here.</i></p><div class='tip err'><b>Частые ошибки:</b> «I can to swim», «He cans», «Do you can swim?», «I can’t to go».</div>",

dt:"— Ты умеешь плавать?<br>— Да, умею. Я очень хорошо плаваю. А ты?<br>— Нет, не умею. Но я умею ездить на велосипеде и играть на гитаре.<br>— Ты можешь сыграть сейчас?<br>— Извини, не могу. Я устал.",
q:[{c:1,q:"He ___ swim.",o:["can","cans","can to"],a:0,e:"Без -s и без to."},{c:1,q:"She can ___.",o:["sings","sing","to sing"],a:1,e:"После can глагол без to и без -s."},{c:1,q:"Вопрос «Ты умеешь водить?»",o:["Do you can drive?","Can you drive?","You can drive?"],a:1,e:"Вопрос: Can + you + глагол."},{c:1,q:"I ___ hear you. (я не слышу)",o:["don’t can","can’t","not can"],a:1,e:"Отрицание: can’t."},{c:1,q:"Вежливая просьба на английском:",o:["Can you speak more slowly?","You speak slowly.","Do you speak slowly can?"],a:0,e:"Can you + глагол…?"},{t:1,q:"Переведите: Я умею готовить.",a:["i can cook"],e:"I can cook."},{t:1,q:"Переведите: Он не умеет плавать.",a:["he can’t swim","he cannot swim"],e:"He can’t swim."},{t:1,q:"Исправьте: She can to play the guitar.",a:["she can play the guitar"],e:"После can нет to."},{t:1,q:"Исправьте: Does he can run fast?",a:["can he run fast"],e:"Вопрос с can без does."},{t:1,q:"Переведите: Можно открыть окно?",a:["can i open the window"],e:"Can I open the window?"},{t:1,q:"Can she swim? Ответьте «нет»: No, ___.",a:["she can’t","she cannot"],e:"No, she can’t."},{t:1,q:"Переведите: Я немного говорю по-английски.",a:["i can speak a little english","i speak a little english"],e:"I can speak a little English."}],
sp:"Скажите вслух 6 предложений: что вы умеете и не умеете (I can… / I can’t…). Потом отработайте 3 вежливые просьбы из раздела «Готовые фразы».",rd:"My friend Sam can swim and ride a bike, but he can’t drive a car. He can speak English and a little Spanish. He can’t sing, but he can play the guitar. Can you play an instrument? Can you cook? I can cook pasta, but I can’t cook fish.",rt:"Мой друг Сэм умеет плавать и ездить на велосипеде, но не умеет водить машину. Он говорит по-английски и немного по-испански. Он не умеет петь, но умеет играть на гитаре. Умеете ли вы играть на каком-нибудь инструменте? Умеете ли вы готовить? Я умею готовить пасту, но не умею готовить рыбу."},
{t:"A1 · Юнит 5: Числа, время, дни недели",
ex:"<h3>Числа</h3><div class='wr'><table><tr><th>0–10</th><td>0 zero · 1 one · 2 two · 3 three · 4 four · 5 five · 6 six · 7 seven · 8 eight · 9 nine · 10 ten</td></tr><tr><th>11–19</th><td>eleven · twelve · thirteen · fourteen · fifteen · sixteen · seventeen · eighteen · nineteen</td></tr><tr><th>Десятки</th><td>20 twenty · 30 thirty · 40 forty · 50 fifty · 60 sixty · 70 seventy · 80 eighty · 90 ninety</td></tr><tr><th>Крупные</th><td>100 a hundred · 1000 a thousand</td></tr></table></div><ul><li><b>21–99:</b> десяток + дефис + единица: <i>twenty-one, forty-seven</i>.</li><li><b>Сотни:</b> между сотней и остатком ставится <b>and</b>: <i>125 = a hundred and twenty-five</i>.</li><li><b>-teen и -ty различаются ударением:</b> thir<b>teen</b> (13, ударение на конце) и <b>thir</b>ty (30, ударение в начале). На слух их путают чаще всего.</li><li>Возраст: <i>I’m twenty-eight.</i> (слова «years old» можно не добавлять). Вопрос: <i>How old are you?</i></li></ul><h3>Время</h3><div class='wr'><table><tr><th>Время</th><th>Английский</th><th>Логика</th></tr><tr><td>7:00</td><td>It’s seven <b>o’clock</b>.</td><td>ровно семь</td></tr><tr><td>7:30</td><td>It’s <b>half past</b> seven.</td><td>«половина после семи»</td></tr><tr><td>7:15</td><td>It’s a <b>quarter past</b> seven.</td><td>четверть после семи</td></tr><tr><td>7:45</td><td>It’s a <b>quarter to</b> eight.</td><td>четверть до восьми</td></tr><tr><td>7:10</td><td>It’s ten <b>past</b> seven.</td><td>1–30 минут: past (после)</td></tr><tr><td>7:40</td><td>It’s twenty <b>to</b> eight.</td><td>31–59 минут: to (до следующего часа)</td></tr></table></div><p>Вопрос: <i>What time is it?</i> (Сколько времени?). Здесь подлежащее <b>it</b>: «это» о времени. С Present Simple: <i>What time do you get up?</i> — Во сколько ты встаёшь?</p><h3>Предлоги времени: at / on / in</h3><ul><li><b>at</b> — точное время и отдельные выражения: <i>at seven, at night, at the weekend</i></li><li><b>on</b> — дни и даты: <i>on Monday, on my birthday</i></li><li><b>in</b> — части дня, месяцы, годы: <i>in the morning, in May, in 2026</i></li></ul><p>Дни недели (с большой буквы): Monday (пн), Tuesday (вт), Wednesday (ср), Thursday (чт), Friday (пт), Saturday (сб), Sunday (вс).</p><h3>Большие числа, годы, телефоны</h3><ul><li><b>1,000</b> — запятая отделяет тысячи (<i>one thousand</i>); десятичная <b>точка</b>: <i>3.5 = three point five</i>.</li><li><b>Годы</b> читаются парами: <i>1999 — nineteen ninety-nine, 2026 — twenty twenty-six</i>.</li><li><b>Телефон</b> называют по цифрам: <i>0 — zero</i> или <i>oh</i> (в британском). <i>555-0142 — five five five, oh one four two.</i></li></ul><h3>Даты</h3><p>Пишем и говорим: <i>May 5th</i> (США) или <i>5 May / the fifth of May</i> (Британия). Числа вида 03/04 читают <b>по-разному</b>: в Британии это 3 апреля (день/месяц), в США — 4 марта (месяц/день). В международной переписке пишите месяц словом. Вопросы: <i>What’s the date today?</i> — Какое сегодня число? <i>What day is it?</i> — Какой день недели? <i>When is your birthday? — It’s on May 5th.</i></p><h3>Часы: два формата</h3><p>В разговоре используют 12-часовой формат с <b>a.m.</b> (до полудня) и <b>p.m.</b> (после): <i>7 a.m., 6:30 p.m.</i> В расписаниях встречается 24-часовой: <i>18:30</i>, а читают его как <i>six thirty</i> или <i>eighteen thirty</i>. Есть слова <b>noon</b> (полдень) и <b>midnight</b> (полночь). Минуты можно говорить цифрами: <i>7:55 — seven fifty-five</i> = <i>five to eight</i>.</p><p>Ещё ошибки: «How much time is it?» (нужно What time is it?), «It’s five hours» (нужно It’s five o’clock), «in the weekend» (at the weekend в Британии, on the weekend в США).</p><div class='tip err'><b>Частые ошибки:</b> «in Monday» (нужно on), «at the morning» (нужно in), «It’s half seven» как перевод «половина седьмого» (в английском половина <i>после</i> часа: 7:30 = half past seven).</div>",

sp:"Назовите вслух числа от 1 до 20, затем десятки до 100. Потом произнесите время на часах пять раз в течение дня: It’s…",rd:"It is Monday. It is half past seven. Ben gets up at seven. His lesson is at nine o’clock. On Tuesday and Thursday he has English. On Saturday he has a party at eight in the evening. Sunday is a free day. He has twenty-five euros.",rt:"Сегодня понедельник. Половина восьмого. Бен встаёт в семь. Его урок в девять часов. По вторникам и четвергам у него английский. В субботу в восемь вечера у него вечеринка. Воскресенье — свободный день. У него двадцать пять евро."},
{t:"A1 · Юнит 6: There is / There are — что где находится",
ex:"<p>Чтобы сказать, что что-то <b>есть</b> или <b>находится</b> в каком-то месте, английский использует конструкцию <b>there is / there are</b>. Русское «В комнате есть стол» нельзя перевести слово в слово: <i>In the room is a table</i> — неверно. Верно: <i>There is a table in the room.</i></p><div class='wr'><table><tr><th></th><th>Один предмет</th><th>Несколько</th></tr><tr><td>Утверждение</td><td>There <b>is</b> a book. (There’s)</td><td>There <b>are</b> two books.</td></tr><tr><td>Отрицание</td><td>There <b>isn’t</b> a book.</td><td>There <b>aren’t</b> any books.</td></tr><tr><td>Вопрос</td><td><b>Is</b> there a book?</td><td><b>Are</b> there any books?</td></tr><tr><td>Краткий ответ</td><td>Yes, there is. / No, there isn’t.</td><td>Yes, there are. / No, there aren’t.</td></tr></table></div><ul><li><b>there</b> здесь не значит «там»: это формальное слово-подлежащее. Глагол is/are согласуется с <b>первым существительным после него</b>: <i>There is a pen and two books.</i></li><li><b>a / an</b> ставится с одним предметом: <i>There is a sofa.</i> Для нескольких — числительное или some: <i>There are three chairs. There are some shelves.</i></li><li><b>some</b> — в утверждении; <b>any</b> — в отрицании и вопросе: <i>There are some books. There aren’t any books. Are there any books?</i> Эти слова работают и с неисчисляемыми: <i>Is there any milk?</i></li><li>Количество спрашиваем так: <i>How many books are there?</i> (сколько книг есть).</li></ul><h3>There is или It is?</h3><p><b>There is</b> — сообщаем, что что-то существует (впервые упоминаем): <i>There is a bank near here.</i> <b>It is</b> — говорим о том, что уже известно: <i>It is big.</i></p><h3>Есть = there is, иметь = have</h3><p>Русское «есть» бывает двух видов, и английский их различает. <b>Существует или находится</b> → <i>there is / are</i>: <i>There is a museum in our city.</i> <b>Принадлежит кому-то</b> → <i>have / has</i>: <i>I have a bike.</i> Сравните: «В квартире есть балкон» (<i>There is a balcony in the flat</i>) и «У меня есть квартира» (<i>I have a flat</i>).</p><h3>Порядок слов</h3><p>Русская фраза часто начинается с места: «В парке есть озеро». Английская чаще идёт так: <b>There is + что + где</b>: <i>There is a lake in the park.</i> Место в конце — это обычный порядок.</p><h3>There is no… — «нет»</h3><p>Отрицание можно сказать двумя способами с тем же смыслом: <i>There isn’t any milk.</i> = <i>There is no milk.</i> После <b>no</b> any не нужен: <i>There are no chairs.</i> (не <i>no any chairs</i>). Вариант с <i>no</i> звучит чуть сильнее.</p><h3>Количество и вопросы</h3><ul><li><b>How many … are there?</b> — Сколько их? Ответ: <i>There are three. / There aren’t any.</i></li><li>Много: <i>There are <b>a lot of</b> people.</i> (в утверждении лучше a lot of, чем many).</li><li>Неисчисляемые тоже идут с is: <i>There is some water. Is there any bread?</i></li></ul><h3>Сокращения и ответы</h3><p>В речи и в письме: <i>There’s a bank.</i> Форма <i>there’re</i> в письме не пишется, говорят <i>there are</i>. Краткие ответы не сокращаются в утверждении: <i>Yes, there is.</i> (не <i>Yes, there’s</i>), но в отрицании можно: <i>No, there isn’t.</i></p><p>Ещё ошибки: «There have two chairs», «There is many people» (нужно There are many people), «It is a bank near here» (нужно There is a bank near here).</p><div class='tip err'><b>Частые ошибки:</b> «There is two chairs» (нужно are), «Have a table in the room» (нужно There is), «Are there some books?» (в вопросе any), «There aren’t some» (нужно any).</div>",

q:[{c:1,q:"There ___ a book on the table.",o:["is","are","have"],a:0,e:"Один предмет → is."},{c:1,q:"There ___ two chairs in the room.",o:["is","are","has"],a:1,e:"Несколько → are."},{c:1,q:"___ there a bank near here?",o:["Are","Is","Do"],a:1,e:"Вопрос: Is there…?"},{c:1,q:"There aren’t ___ apples.",o:["some","any","a"],a:1,e:"В отрицании any."},{c:1,q:"Is there ___ milk in the kitchen?",o:["some","any","an"],a:1,e:"В вопросе any."},{c:1,q:"«В комнате есть стол» по-английски:",o:["In the room is a table.","There is a table in the room.","The room has a table there."],a:1,e:"There is + предмет + место."},{t:1,q:"There ___ three beds. (is/are)",a:["are"],e:"Несколько → are."},{t:1,q:"Исправьте: There is two chairs.",a:["there are two chairs"],e:"Два стула → are."},{t:1,q:"Переведите: Здесь рядом есть банк?",a:["is there a bank near here"],e:"Is there a bank near here?"},{t:1,q:"Переведите: В комнате нет дивана.",a:["there isn’t a sofa in the room","there is no sofa in the room","there’s no sofa in the room"],e:"There isn’t a sofa in the room."},{t:1,q:"Are there any shelves? Ответьте «нет»: No, ___.",a:["there aren’t"],e:"No, there aren’t."},{t:1,q:"How ___ books are there on the table?",a:["many"],e:"How many + исчисляемое."}],
sp:"Опишите вслух свою комнату: 6 предложений (There is… There are… There isn’t… ). Затем задайте себе 2 вопроса: Is there…? Are there any…?",rd:"There is a big park near my house. There is a lake in the park and there are two bridges over the lake. There are many trees and some benches. There isn’t a café, but there is a small shop. There aren’t any cars in the park.",rt:"Рядом с моим домом большой парк. В парке есть озеро, а над озером два моста. Там много деревьев и несколько скамеек. Кафе нет, но есть маленький магазин. В парке нет машин."},
{t:"A1 · Юнит 7: Предлоги места — in, on, at и другие",
ex:"<p>Предлог места отвечает на вопрос <b>Where?</b> (где?). В английском выбор предлога зависит не от слова, а от <b>типа места</b>.</p><div class='wr'><table><tr><th>Предлог</th><th>Когда</th><th>Примеры</th></tr><tr><td><b>in</b></td><td>внутри, в замкнутом пространстве, в городе или стране</td><td>in the room — в комнате · in London — в Лондоне · in a car — в машине</td></tr><tr><td><b>on</b></td><td>на поверхности или линии; в общественном транспорте</td><td>on the table — на столе · on the wall — на стене · on the bus — в автобусе</td></tr><tr><td><b>at</b></td><td>точка, место действия, адрес</td><td>at home — дома · at work — на работе · at the station — на станции · at the door — у двери</td></tr></table></div><h3>Другие предлоги места</h3><div class='wr'><table><tr><th>Предлог</th><th>Значение</th><th>Пример</th></tr><tr><td>in front of</td><td>перед</td><td>The car is in front of the hotel.</td></tr><tr><td>behind</td><td>позади</td><td>The park is behind the hotel.</td></tr><tr><td>opposite</td><td>напротив</td><td>The shop is opposite the bank.</td></tr><tr><td>next to</td><td>рядом с</td><td>The bank is next to the shop.</td></tr><tr><td>above</td><td>над (не касаясь)</td><td>The picture is above the sofa.</td></tr><tr><td>under</td><td>под</td><td>The key is under the table.</td></tr><tr><td>far from</td><td>далеко от</td><td>The airport is far from the city.</td></tr></table></div><ul><li><b>Устойчивые выражения без артикля:</b> <i>at home, at work, at school, in bed, in hospital</i>. Нельзя: «at the home».</li><li><b>Движение к месту:</b> <i>go home</i> (без to!), но <i>go to work, go to school, go to the park</i>.</li><li><b>Транспорт:</b> <i>on a bus, on a train, on a plane</i>, но <i>in a car, in a taxi</i>.</li></ul><h3>In, on, at: расширенные примеры</h3><div class='wr'><table><tr><th>Выражение</th><th>Что значит</th></tr><tr><td>in the corner / on the corner</td><td>в углу комнаты / на углу улицы</td></tr><tr><td>in the middle of</td><td>посередине (чего-то)</td></tr><tr><td>on the left / on the right</td><td>слева / справа (не <i>in the left</i>)</td></tr><tr><td>at the top / at the bottom of</td><td>наверху / внизу (чего-то)</td></tr><tr><td>on TV, on the phone, on the internet</td><td>по телевизору, по телефону, в интернете</td></tr><tr><td>in the picture / on the wall</td><td>на картине (внутри изображения) / на стене</td></tr></table></div><h3>Здание или назначение</h3><p>Сравните: <i>I’m <b>at</b> school</i> (я учусь, это моё место деятельности) и <i>The books are <b>in</b> the school</i> (внутри здания). Так же: <i>at the cinema, at the airport, at the gym</i> — мы там, чтобы смотреть кино, лететь, тренироваться. Для врача: <i>at the doctor’s</i> (у врача, в его кабинете).</p><h3>Адреса и этажи</h3><ul><li><b>at</b> + номер дома: <i>at 10 Baker Street</i>; <b>on</b> + улица: <i>on Baker Street</i>; <b>in</b> + город: <i>in London</i>.</li><li><b>Этаж:</b> <i>on the second floor</i>. Внимание: в Британии <i>ground floor</i> — это первый этаж (на уровне земли), а <i>first floor</i> — второй по-русски. В США <i>first floor</i> — это этаж на уровне земли.</li></ul><h3>Near, by, between, among</h3><p><b>near</b> — недалеко; <b>by</b> — рядом, вплотную (<i>by the window</i>); <b>between</b> — между двумя; <b>among</b> — среди многих: <i>She is among friends.</i></p><p>Ещё ошибки: «in the left» (нужно on the left), «I work in a bank at the third floor» (нужно on the third floor), «in a bus» (нужно on a bus).</p><div class='tip err'><b>Частые ошибки:</b> «I’m in work» (нужно at work), «I go to home» (нужно go home), «in the bus» (нужно on the bus), «on the room» (нужно in the room).</div>",

sp:"Опишите вслух, где что находится в вашей комнате и на вашей улице: 8 предложений с in, on, at, next to, opposite, under.",rd:"My room is on the second floor. The bed is next to the window. The desk is between the bed and the door. The lamp is on the desk and my bag is under the chair. A picture is above the bed. My cat is in the box under the desk.",rt:"Моя комната на втором этаже. Кровать рядом с окном. Письменный стол между кроватью и дверью. Лампа на столе, а моя сумка под стулом. Картина над кроватью. Мой кот в коробке под столом."},
{t:"A1 · Юнит 8: this / that / these / those, ’s и whose",
ex:"<h3>Указательные местоимения</h3><div class='wr'><table><tr><th></th><th>Один предмет</th><th>Несколько</th></tr><tr><td>Близко (рядом со мной)</td><td><b>this</b> — этот</td><td><b>these</b> — эти</td></tr><tr><td>Далеко (там)</td><td><b>that</b> — тот</td><td><b>those</b> — те</td></tr></table></div><ul><li>Работают двумя способами: <b>вместо существительного</b> (<i>This is a book.</i> — Это книга) и <b>перед ним</b> (<i>this book</i> — эта книга).</li><li>С множественным числом: <i>These are keys.</i> Не «This are keys».</li><li><b>that is</b> сокращается (<i>that’s</i>), а <b>this is</b> — нет (не «this’s»).</li><li>Знакомим людей: <i>This is my friend Anna.</i> (рядом). Вопрос: <i>What’s this?</i> / <i>What are those?</i></li></ul><h3>Притяжательный падеж ’s — «чей?»</h3><div class='wr'><table><tr><th>Случай</th><th>Правило</th><th>Пример</th></tr><tr><td>один владелец</td><td>существительное + <b>’s</b></td><td>Tom’s passport — паспорт Тома</td></tr><tr><td>несколько владельцев (-s)</td><td>существительное + <b>’</b></td><td>the students’ books — книги студентов</td></tr><tr><td>мн. число без -s</td><td>+ <b>’s</b></td><td>children’s toys — детские игрушки</td></tr></table></div><ul><li>Для людей и животных используем ’s. Для вещей — предлог <b>of</b>: <i>the door of the room</i> (не «the room’s door»).</li><li>Осторожно: <b>’s</b> бывает ещё и сокращением от <b>is</b>: <i>Tom’s a teacher</i> (Том — учитель) и <i>Tom’s car</i> (машина Тома). Смотрите: после ’s идёт существительное → принадлежность; прилагательное или артикль → is.</li></ul><h3>Whose — чей?</h3><p><i>Whose bag is this?</i> — Чья это сумка? Ответ: <i>It’s Anna’s.</i> (Анина) или <i>It’s mine / yours / hers.</i> (см. справочник).</p><h3>This и that в разговоре</h3><ul><li><b>Представление по телефону:</b> <i>Hello, this is Anna.</i> (Здравствуйте, это Анна.) Спросить: <i>Who is this?</i></li><li><b>That</b> часто означает «то, что только что сказали»: <i>That’s a good idea! That’s great.</i></li><li><b>this one / that one</b> — «этот / тот» вместо повторения слова: <i>Which bag is yours? — This one.</i> Во множественном числе: <i>these / those</i>.</li></ul><h3>’s: три значения</h3><div class='wr'><table><tr><th>Пример</th><th>Что значит ’s</th></tr><tr><td>Tom’s car</td><td>принадлежность (машина Тома)</td></tr><tr><td>Tom’s a teacher.</td><td>сокращение от <b>is</b></td></tr><tr><td>Tom’s got a car.</td><td>сокращение от <b>has</b> (have got)</td></tr></table></div><p>Отличие смотрим по слову <b>после</b> ’s: существительное → принадлежность; артикль или прилагательное → is; <i>got</i> → has.</p><h3>Имена на -s и два владельца</h3><p>Имя на -s: <i>James’s book</i> или <i>James’ book</i> (читается одинаково: «Джеймс-из»). Двое владельцев: <i>Tom and Anna’s house</i> — общий дом; <i>Tom’s and Anna’s houses</i> — у каждого свой.</p><h3>Of вместо ’s</h3><p>Для вещей и понятий: <i>the end of the film, the name of the street, the top of the page</i>. Для людей и животных предпочтительнее ’s: <i>my mother’s name</i>.</p><h3>Whose и who’s</h3><p><b>Whose</b> — чей: <i>Whose keys are these?</i> <b>Who’s</b> — сокращение от <b>who is</b>: <i>Who’s that?</i> На слух они одинаковы, на письме их путают чаще всего.</p><p>Ещё ошибки: «Who’s bag is this?» (нужно Whose bag), «the Tom’s car» (артикль не нужен), «mine’s book» (нужно my book или mine).</p><div class='tip err'><b>Частые ошибки:</b> «This are my friends», «This’s my watch», «Annas bag» (нужно Anna’s), «childrens’ toys» (нужно children’s).</div>",

q:[{c:1,q:"___ is my friend. (человек рядом)",o:["This","These","Those"],a:0,e:"Один, рядом → this."},{c:1,q:"___ are my keys. (рядом)",o:["This","These","That"],a:1,e:"Несколько, рядом → these."},{c:1,q:"___ cars over there are expensive.",o:["That","This","Those"],a:2,e:"Несколько и далеко → those."},{c:1,q:"Whose bag is this?",o:["It’s Anna’s.","It’s Annas.","It’s Anna."],a:0,e:"’s показывает владельца."},{c:1,q:"«Книги студентов» (несколько студентов):",o:["the student’s books","the students’ books","the students books"],a:1,e:"Мн. число на -s → ’ после s."},{c:1,q:"«Детские игрушки»:",o:["childrens’ toys","children’s toys","childs’ toys"],a:1,e:"children не оканчивается на -s → ’s."},{t:1,q:"Переведите: Это паспорт Тома. (рядом)",a:["this is tom’s passport","it’s tom’s passport"],e:"Tom’s passport."},{t:1,q:"Переведите: Чья это сумка?",a:["whose bag is this"],e:"Whose bag is this?"},{t:1,q:"Исправьте: This are my friends.",a:["these are my friends"],e:"Несколько → these are."},{t:1,q:"Исправьте: This’s my watch.",a:["this is my watch"],e:"this is не сокращается."},{t:1,q:"Переведите: Это мои родители. (рядом)",a:["these are my parents"],e:"These are my parents."},{t:1,q:"Переведите: Это не мой билет. (рядом)",a:["this isn’t my ticket","this is not my ticket"],e:"This isn’t my ticket."}],
sp:"Возьмите 6 предметов дома. Указывая на ближние и дальние, скажите: This is… These are… That’s… Those are… Затем: Whose … is this?",rd:"This is my sister’s house. That is her car. These are her children’s toys, and those are my brother’s books. Whose bag is this? It is Kate’s. Whose keys are those? They are Mike’s.",rt:"Это дом моей сестры. То её машина. Это игрушки её детей, а то книги моего брата. Чья это сумка? Это сумка Кейт. Чьи это ключи? Это ключи Майка."},
{t:"A1 · Юнит 9: Present Continuous — что происходит сейчас",
ex:"<p><b>Present Continuous</b> описывает действие, которое происходит <b>прямо сейчас</b> или в этот период. <i>She is working now.</i> — Она сейчас работает. Сравните с Present Simple (юнит 3): <i>She works every day.</i> — Она работает каждый день (привычка).</p><h3>Форма: to be + глагол с -ing</h3><div class='wr'><table><tr><th></th><th>Пример</th><th>Перевод</th></tr><tr><td>Утверждение</td><td>I <b>am</b> work<b>ing</b>. / He <b>is</b> work<b>ing</b>. / They <b>are</b> work<b>ing</b>.</td><td>Я работаю / Он работает / Они работают (сейчас)</td></tr><tr><td>Отрицание</td><td>She <b>isn’t</b> work<b>ing</b>.</td><td>Она сейчас не работает</td></tr><tr><td>Вопрос</td><td><b>Is</b> she work<b>ing</b>?</td><td>Она сейчас работает?</td></tr><tr><td>Краткий ответ</td><td>Yes, she <b>is</b>. / No, she <b>isn’t</b>.</td><td>Да. / Нет.</td></tr></table></div><p>Вопросительное слово — в начало: <i>What are you doing?</i> — Что ты делаешь? <i>Where are you going?</i> — Куда ты идёшь?</p><h3>Правописание -ing</h3><div class='wr'><table><tr><th>Правило</th><th>Пример</th></tr><tr><td>обычно +ing</td><td>work → working, read → reading</td></tr><tr><td>на немое -e: e убираем</td><td>make → making, leave → leaving</td></tr><tr><td>короткое слово: согласная + гласная + согласная → удваиваем последнюю</td><td>run → running, sit → sitting, swim → swimming</td></tr><tr><td>ie → ying</td><td>lie → lying</td></tr></table></div><h3>Слова-подсказки</h3><p><b>now</b> (сейчас), <b>at the moment</b> (в данный момент), <b>right now</b> (прямо сейчас), <b>today</b>, а также команды <b>Look!</b> (Смотри!) и <b>Listen!</b> (Слушай!).</p><h3>Глаголы, которые не употребляются в Continuous</h3><p>Глаголы состояния, а не действия: <b>know</b> (знать), <b>like</b> (нравиться), <b>love</b> (любить), <b>want</b> (хотеть), <b>need</b> (нуждаться), <b>understand</b> (понимать), <b>have</b> в значении «иметь». Говорим: <i>I know the answer</i> (не «I am knowing»), <i>I want tea</i> (не «I am wanting»).</p><h3>Present Simple или Present Continuous: как выбрать</h3><div class='wr'><table><tr><th></th><th>Present Simple</th><th>Present Continuous</th></tr><tr><td>Смысл</td><td>постоянно, регулярно</td><td>сейчас, временно</td></tr><tr><td>Пример</td><td>She works in a bank.</td><td>She is working at home today.</td></tr><tr><td>Слова-маркеры</td><td>always, every day, usually, on Mondays</td><td>now, at the moment, today, this week, Look!</td></tr></table></div><p>Если спросить себя «это происходит <b>прямо сейчас</b> или <b>в эти дни</b>?» — выбирайте Continuous. Если «это <b>обычно</b>, <b>всегда</b>?» — Simple.</p><h3>«Сейчас» бывает широким</h3><p>Continuous описывает не только эту секунду, но и <b>период вокруг сегодняшнего дня</b>: <i>I’m reading a good book.</i> (читаю сейчас, хотя не прямо в эту секунду). <i>He is learning English this year.</i></p><h3>Ближайшие планы</h3><p>Continuous употребляют и для <b>договорённости на ближайшее будущее</b>: <i>I’m meeting Tom tomorrow.</i> — Я встречаюсь с Томом завтра. С указанием времени (tomorrow, on Friday, tonight) это уже план, а не действие сейчас.</p><h3>Особые случаи</h3><ul><li><b>have</b> как «иметь» — без Continuous: <i>I have a car</i> (не <i>I’m having a car</i>). Но как действие можно: <i>I’m having breakfast. She is having a shower.</i></li><li><b>Краткие ответы не сокращаются:</b> <i>Yes, I am.</i> (не <i>Yes, I’m</i>), <i>No, she isn’t.</i></li><li>Вопрос «Что вы делаете?» бывает и вежливым вопросом о профессии, но для работы чаще: <i>What do you do?</i> (Simple, постоянное). <i>What are you doing?</i> — что вы делаете <b>сейчас</b>.</li></ul><div class='tip err'><b>Ошибки русскоговорящих:</b> «I work now» (нужно I’m working now), «What do you do?» в значении «Что ты делаешь сейчас?» (нужно What are you doing?), «She is work at the moment» (нужно is working).</div>",

q:[{c:1,q:"She ___ now.",o:["works","is working","working"],a:1,e:"Сейчас → is + working."},{c:1,q:"They ___ TV at the moment.",o:["watch","are watching","is watching"],a:1,e:"they → are + watching."},{c:1,q:"I ___ English every day. (привычка)",o:["study","am studying","studies"],a:0,e:"Каждый день → Present Simple."},{c:1,q:"I ___ the answer. (знаю)",o:["know","am knowing"],a:0,e:"know — глагол состояния."},{c:1,q:"Выберите верное:",o:["She is run.","She is running.","She running."],a:1,e:"run → running (удваиваем n)."},{t:1,q:"Добавьте -ing: swim →",a:["swimming"],e:"swim → swimming."},{t:1,q:"Добавьте -ing: make →",a:["making"],e:"make → making (e убираем)."},{t:1,q:"Исправьте: He working now.",a:["he is working now","he’s working now"],e:"Нужен is."},{t:1,q:"Переведите: Что ты делаешь?",a:["what are you doing"],e:"What are you doing?"},{t:1,q:"Переведите: Идёт дождь.",a:["it’s raining","it is raining"],e:"It’s raining."},{t:1,q:"Переведите: Она не спит.",a:["she isn’t sleeping","she is not sleeping","she’s not sleeping"],e:"She isn’t sleeping."},{t:1,q:"Is he waiting? Ответьте «да»: Yes, ___.",a:["he is"],e:"Yes, he is."}],
sp:"Посмотрите вокруг и опишите вслух, что происходит прямо сейчас (8 предложений): I’m sitting… It’s raining… My neighbour is…",rd:"It is Sunday afternoon. I am at home. I am not working. My mother is cooking in the kitchen and my father is reading a newspaper. My sister is not studying, she is listening to music. Are you watching TV now? No, I am writing this text.",rt:"Воскресный день. Я дома. Я не работаю. Моя мама готовит на кухне, а папа читает газету. Моя сестра не учится, она слушает музыку. Ты сейчас смотришь телевизор? Нет, я пишу этот текст."},
{t:"A1 · Юнит 10: Еда, заказ в кафе, much и many",
ex:"<h3>Исчисляемые и неисчисляемые существительные</h3><div class='wr'><table><tr><th></th><th>Исчисляемые</th><th>Неисчисляемые</th></tr><tr><td>Что это</td><td>можно посчитать: apple, egg, sandwich</td><td>нельзя посчитать: water, bread, rice, milk, coffee, cheese, sugar, meat, money</td></tr><tr><td>Мн. число</td><td>есть: apples</td><td><b>нет</b>: не «waters», не «breads»</td></tr><tr><td>a / an</td><td>можно: an apple</td><td><b>нельзя</b>: не «a bread»</td></tr><tr><td>Количество</td><td>two apples, <b>many</b> apples</td><td><b>some</b> bread, <b>much</b> water, <b>a lot of</b> rice</td></tr></table></div><ul><li>Чтобы посчитать неисчисляемое, используют меру: <i>a glass of water, a cup of tea, a bottle of milk, a piece of bread</i>.</li><li><b>many</b> — с исчисляемыми (<i>How many apples?</i>), <b>much</b> — с неисчисляемыми (<i>How much milk?</i>). Оба в основном в отрицании и вопросах. В утверждении лучше <b>a lot of</b>: <i>I have a lot of friends.</i></li><li>Some/any (см. юнит 6): в вопросах-предложениях (<i>Would you like some tea?</i>) и просьбах (<i>Can I have some water?</i>) тоже ставится <b>some</b>.</li></ul><h3>Вежливый заказ: would like</h3><div class='wr'><table><tr><th>Фраза</th><th>Смысл</th><th>Когда</th></tr><tr><td><b>I like</b> coffee.</td><td>Мне нравится кофе</td><td>вкусы, постоянно</td></tr><tr><td><b>I’d like</b> a coffee, please.</td><td>Я бы хотел кофе (сейчас)</td><td>заказ, просьба; вежливо</td></tr><tr><td><b>Would you like</b> some tea?</td><td>Хотите чаю?</td><td>предложение</td></tr><tr><td><b>Can I have</b> the menu?</td><td>Можно мне меню?</td><td>просьба</td></tr><tr><td>I want coffee.</td><td>Я хочу кофе</td><td>звучит грубо в кафе — лучше I’d like</td></tr></table></div><p><i>I’d</i> = <i>I would</i>. После would like — существительное (<i>I’d like a coffee</i>) или to + глагол (<i>I’d like to sit here</i>). Ответ на предложение: <i>Yes, please.</i> (Да, пожалуйста) / <i>No, thank you.</i> (Нет, спасибо).</p><h3>A little, a few и без артикля</h3><div class='wr'><table><tr><th></th><th>Исчисляемые</th><th>Неисчисляемые</th></tr><tr><td>немного (достаточно)</td><td>a few apples</td><td>a little milk</td></tr><tr><td>почти нет (мало)</td><td>few apples</td><td>little milk</td></tr></table></div><p>Артикль <b>a</b> меняет смысл на положительный: <i>I have a few friends</i> (есть немного друзей, и это нормально) и <i>I have few friends</i> (почти нет друзей). Для «много» в утверждении: <i>a lot of / lots of</i>.</p><h3>Like и would like</h3><p><i>Do you like coffee?</i> — Вы вообще любите кофе? <i>Would you like a coffee?</i> — Хотите кофе (сейчас)? Ответ на предложение: <i>Yes, please. / No, thanks.</i> На приглашение можно сказать: <i>I’d love to!</i> — С удовольствием!</p><h3>Кафе: кто что говорит</h3><div class='wr'><table><tr><th>Официант</th><th>Гость</th></tr><tr><td>Are you ready to order?</td><td>Yes, I’ll have the soup, please.</td></tr><tr><td>Anything else?</td><td>No, thanks. That’s all.</td></tr><tr><td>Eat in or take away? (США: For here or to go?)</td><td>Take away, please.</td></tr><tr><td>Here you are.</td><td>Thank you. Could I have the bill? (США: check)</td></tr></table></div><p><b>I’ll have…</b> — «я возьму…»: естественный способ заказа, когда вы уже решили. <i>I’d like…</i> тоже вежливо и подходит всегда.</p><h3>Меры еды</h3><p><i>a slice of cheese / pizza, a bowl of soup, a bar of chocolate, a carton of milk, a bottle of water, a packet of rice</i>. С неисчисляемыми существительными используйте такие слова, чтобы указать количество.</p><p>Ещё ошибки: «I’m want a tea» (нужно I want или I’d like), «a few water» (нужно a little water), «Would you like to coffee?» (нужно a coffee).</p><div class='tip err'><b>Частые ошибки:</b> «a water», «two breads», «How many water», «I want a coffee» (в кафе звучит резко), «I’d like to a coffee».</div>",

dl:"— Good evening. What would you like?<br>— I’d like the chicken soup and a salad, please.<br>— Would you like something to drink?<br>— Yes, a glass of water, please. How much is it?<br>— Fifteen pounds.",
dt:"— Добрый вечер. Что вы хотите заказать?<br>— Я бы хотел куриный суп и салат, пожалуйста.<br>— Хотите что-нибудь выпить?<br>— Да, стакан воды, пожалуйста. Сколько это стоит?<br>— Пятнадцать фунтов.",
q:[{c:1,q:"I’d like ___ water.",o:["a","some","two"],a:1,e:"water неисчисляемое → some."},{c:1,q:"Would you like ___ tea?",o:["a","some","many"],a:1,e:"В предложении-угощении some."},{c:1,q:"How ___ money do you have?",o:["many","much"],a:1,e:"money неисчисляемое → much."},{c:1,q:"How ___ apples are there?",o:["much","many"],a:1,e:"apples исчисляемое → many."},{c:1,q:"Вежливо заказать кофе:",o:["I want coffee.","I’d like a coffee, please.","Give me coffee."],a:1,e:"I’d like… please."},{c:1,q:"Что значит I’d like?",o:["Я бы хотел","Мне нравится","Я люблю"],a:0,e:"I’d = I would."},{t:1,q:"Переведите: Стакан воды, пожалуйста.",a:["a glass of water please"],e:"A glass of water, please."},{t:1,q:"Исправьте: I’d like a water.",a:["i’d like water","i’d like some water","i’d like a glass of water"],e:"water неисчисляемое: без a."},{t:1,q:"Исправьте: How many water do you drink?",a:["how much water do you drink"],e:"water → much."},{t:1,q:"Переведите: Сколько это стоит?",a:["how much is it","how much does it cost"],e:"How much is it?"},{t:1,q:"Переведите: Можно мне меню?",a:["can i see the menu","can i have the menu"],e:"Can I have the menu?"},{t:1,q:"Переведите: Счёт, пожалуйста.",a:["the bill please","can i have the bill please"],e:"The bill, please."}],
sp:"Разыграйте вслух заказ в кафе: поздоровайтесь, закажите суп, салат и напиток, спросите цену и попросите счёт. Запишите на диктофон и сравните с диалогом.",rd:"Lisa is in a café. She would like a cup of tea and a sandwich. The waiter asks: «Do you want any sugar?» Lisa says: «No, thanks. I don’t eat much sugar.» There are not many people in the café today. The bill is eight euros.",rt:"Лиза в кафе. Она хотела бы чашку чая и сэндвич. Официант спрашивает: «Хотите сахар?» Лиза говорит: «Нет, спасибо. Я ем немного сахара». Сегодня в кафе мало людей. Счёт — восемь евро."},
{r:1,t:"Повторение 1: юниты 1–10",
ex:"<p>Это <b>повторение</b>: возвращаем всё, что прошли, чтобы не забывать. Сначала просмотрите таблицу правил, затем пройдите смешанные упражнения. Если ошибаетесь в теме, вернитесь в нужный юнит.</p><div class='wr'><table><tr><th>Юнит</th><th>Главное правило</th></tr><tr><td>1 to be и местоимения</td><td>I am, he/she/it is, we/you/they are; подлежащее обязательно</td></tr><tr><td>2 артикли и мн. число</td><td>a/an — один из многих, the — конкретный; -s/-es/-ies, исключения</td></tr><tr><td>3 Present Simple</td><td>he/she/it + s; don’t/doesn’t + глагол без s; Do/Does в вопросе</td></tr><tr><td>4 can</td><td>can + глагол без to; can’t; вопрос без do</td></tr><tr><td>5 числа и время</td><td>half past, quarter to; at + время, on + день, in + часть дня</td></tr><tr><td>6 there is/are</td><td>is — один, are — несколько; some в утверждении, any в отрицании и вопросе</td></tr><tr><td>7 предлоги места</td><td>in внутри, on на поверхности, at в точке; go home без to</td></tr><tr><td>8 this/that, ’s</td><td>this/these близко, that/those далеко; Tom’s, students’, children’s</td></tr><tr><td>9 Present Continuous</td><td>am/is/are + V-ing; действие сейчас; глаголы состояния без -ing</td></tr><tr><td>10 еда, much/many</td><td>неисчисляемые без a и без мн. числа; much/many; I’d like для заказа</td></tr></table></div><h3>Тезисы по всем темам</h3><ul><li><b>Порядок слов:</b> подлежащее → сказуемое → дополнение → место → время: <i>I work in a bank every day.</i> Подлежащее обязательно.</li><li><b>to be:</b> am/is/are; отрицание + not; вопрос — глагол вперёд. Профессия, состояние, возраст, место: <i>She is a doctor. I’m 28.</i></li><li><b>Местоимения:</b> I/you/he/she/it/we/they (до глагола) · me/you/him/her/it/us/them (после глагола и предлога) · my/your/his/her/its/our/their (перед существительным) · mine/yours/hers (без него).</li><li><b>Артикли:</b> a/an — один из многих, первое упоминание, профессия; the — известный и единственный; без артикля — мн. число и неисчисляемые в общем смысле, имена, города, my car.</li><li><b>Мн. число:</b> +s · s/x/ch/sh/o → +es · согласная+y → ies · f/fe → ves · man–men, woman–women, child–children, person–people.</li><li><b>Present Simple:</b> привычки и факты; he/she/it + s; don’t/doesn’t + глагол без s; Do/Does…?; always, usually, often, sometimes, never стоят перед глаголом и после to be.</li><li><b>Present Continuous:</b> am/is/are + V-ing; действие сейчас; не употребляется с know, like, want, love, need, understand.</li><li><b>can:</b> can + глагол без to; одинаков для всех лиц; can’t; вопрос Can you…? без do; просьба и разрешение.</li><li><b>Время и числа:</b> o’clock, half past, quarter past/to; 1–30 минут — past, 31–59 — to; at 7, on Monday, in the morning; thirteen ≠ thirty.</li><li><b>Предлоги места:</b> in (внутри), on (на поверхности), at (точка); in front of, behind, opposite, next to, above, under; go home без to.</li><li><b>there is / there are:</b> is — один, are — несколько; some в утверждении, any в отрицании и вопросе; How many…?</li><li><b>this/that/these/those, ’s, whose:</b> близко/далеко; Tom’s, students’, children’s; Whose bag is this?</li><li><b>Исчисляемые и неисчисляемые:</b> a/an и мн. число только у исчисляемых; much — неисчисляемые, many — исчисляемые, a lot of — оба; a glass of water; I’d like для вежливого заказа.</li><li><b>Вопросы:</b> вопросительное слово (what, who, where, when, why, how, which, whose) + вспомогательный (am/is/are, do/does, can) + подлежащее + глагол.</li></ul><div class='tip'><b>Как повторять:</b> проходите повторение через 2–3 дня после юнитов, затем ещё раз через неделю. Задания, в которых ошиблись, перечитайте вслух.</div>",

q:[{c:1,q:"They ___ my friends.",o:["is","am","are"],a:2,e:"they → are (юнит 1)."},{c:1,q:"She ___ coffee. (не пьёт)",o:["don’t drink","doesn’t drink","doesn’t drinks"],a:1,e:"Юнит 3."},{c:1,q:"I ___ swim. (не умею)",o:["don’t can","can’t","not can"],a:1,e:"Юнит 4."},{c:1,q:"___ there any milk?",o:["Are","Is","Do"],a:1,e:"Юнит 6: milk неисчисляемое → is."},{c:1,q:"I get up ___ seven.",o:["at","on","in"],a:0,e:"Юнит 5."},{t:1,q:"Напишите словами: 14",a:["fourteen"],e:"Юнит 5."},{t:1,q:"Исправьте: She work in a bank.",a:["she works in a bank"],e:"Юнит 3: she + s."},{t:1,q:"Исправьте: I have car.",a:["i have a car"],e:"Юнит 2: артикль."},{t:1,q:"Исправьте: There is three books.",a:["there are three books"],e:"Юнит 6."},{t:1,q:"Исправьте: Does he can swim?",a:["can he swim"],e:"Юнит 4."},{t:1,q:"Переведите: Где она живёт?",a:["where does she live"],e:"Юнит 3."},{t:1,q:"Переведите: Сейчас половина десятого.",a:["it’s half past nine","it is half past nine"],e:"Юнит 5."},{t:1,q:"Переведите: Это не мои ключи. (рядом)",a:["these aren’t my keys","these are not my keys"],e:"Юнит 8."},{t:1,q:"Переведите: Они не умеют петь.",a:["they can’t sing","they cannot sing"],e:"Юнит 4."},{c:1,q:"Anna and I are friends. ___ are from Spain.",o:["We","They","You"],a:0,e:"Юнит 1: Anna and I = we."},{c:1,q:"I like Tom. I see ___ every day.",o:["he","him","his"],a:1,e:"Юнит 1: после глагола him."},{c:1,q:"I have ___ umbrella.",o:["a","an","the"],a:1,e:"Юнит 2: гласный звук → an."},{t:1,q:"Множественное число: knife",a:["knives"],e:"Юнит 2."},{t:1,q:"He ___ (go) to work by bus.",a:["goes"],e:"Юнит 3: go → goes."},{t:1,q:"Исправьте: Do she like tea?",a:["does she like tea"],e:"Юнит 3: she → Does."},{c:1,q:"Look! The children ___.",o:["play","are playing","plays"],a:1,e:"Юнит 9: Look! → Continuous."},{t:1,q:"Исправьте: I am wanting a coffee.",a:["i want a coffee"],e:"Юнит 9: want — глагол состояния."},{c:1,q:"Can I ___ a coffee, please?",o:["has","have","to have"],a:1,e:"Юниты 4 и 10: can + глагол без to."},{t:1,q:"7:45 — It’s a quarter ___ eight.",a:["to"],e:"Юнит 5: 31–59 минут → to."},{c:1,q:"I’m ___ work.",o:["in","on","at"],a:2,e:"Юнит 7: at work."},{t:1,q:"Переведите: В комнате два окна.",a:["there are two windows in the room"],e:"Юнит 6."},{t:1,q:"Переведите: Чья это машина?",a:["whose car is this"],e:"Юнит 8."},{c:1,q:"How ___ sugar do you want?",o:["many","much"],a:1,e:"Юнит 10: sugar неисчисляемое."},{t:1,q:"Переведите: Мы сейчас не едим.",a:["we aren’t eating","we are not eating","we’re not eating"],e:"Юнит 9."},{t:1,q:"Переведите: Они живут рядом с парком.",a:["they live next to the park","they live near the park"],e:"Юниты 3 и 7."}],

{t:"A1 · Юнит 11: Мой дом, have / has и прилагательные",
ex:"<h3>have / has — иметь, «у меня есть»</h3><p>По-русски: «<b>У меня</b> есть квартира». По-английски подлежащее — «я», а не «у меня»: <i>I <b>have</b> a flat.</i></p><div class='wr'><table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr><tr><td>Утверждение</td><td>I <b>have</b> a flat.</td><td>She <b>has</b> a flat.</td></tr><tr><td>Отрицание</td><td>I <b>don’t have</b> a car.</td><td>She <b>doesn’t have</b> a car.</td></tr><tr><td>Вопрос</td><td><b>Do</b> you <b>have</b> a garden?</td><td><b>Does</b> she <b>have</b> a garden?</td></tr><tr><td>Краткий ответ</td><td colspan='2'>строится как в юните 3</td></tr></table></div><ul><li><b>has</b> — особая форма для he/she/it (не «haves»). Но после doesn’t и does возвращается <b>have</b>: <i>She doesn’t have</i> (не «doesn’t has»).</li><li>Британский вариант с тем же смыслом: <b>have got</b>. <i>I’ve got a flat. She’s got two sisters. Have you got a car? — No, I haven’t.</i></li><li><b>have</b> бывает и «действием»: <i>have breakfast, have a shower, have a good time</i>. Тогда это не «иметь».</li></ul><h3>Прилагательные</h3><ul><li>Стоят <b>перед существительным</b>: <i>a big room</i>. После to be — без существительного: <i>The room is big.</i></li><li><b>Не изменяются</b> по числу и роду: <i>a big room, big rooms</i> (не «bigs»).</li><li><b>Порядок:</b> мнение → размер → возраст → цвет → материал: <i>a nice big old red wooden table</i>. В повседневной речи обычно 2–3 прилагательных: <i>a big red car</i> (не «a red big car»).</li><li>Усилители: <b>very</b> (очень), <b>quite</b> (довольно), <b>too</b> (слишком, с оттенком «это плохо»): <i>The kitchen is too small.</i></li></ul><p><b>Цвета:</b> red (красный), blue (синий, голубой), green (зелёный), yellow (жёлтый), black (чёрный), white (белый), brown (коричневый), grey (серый), pink (розовый), orange (оранжевый).</p><h3>Have got: полная схема</h3><div class='wr'><table><tr><th></th><th>Форма</th><th>Пример</th></tr><tr><td>Утверждение</td><td>I’ve got / She’s got</td><td>I’ve got a big flat.</td></tr><tr><td>Отрицание</td><td>haven’t got / hasn’t got</td><td>She hasn’t got a car.</td></tr><tr><td>Вопрос</td><td>Have you got…? / Has she got…?</td><td>Have you got a pen?</td></tr><tr><td>Краткий ответ</td><td>Yes, I have. / No, she hasn’t.</td><td>Yes, I have. (не <i>Yes, I’ve</i>)</td></tr></table></div><p>Have got особенно употребительно в британском английском, а американцы чаще говорят <i>Do you have…?</i> Оба варианта понимают везде. <b>Have got</b> не употребляют в «действиях» вроде <i>have breakfast</i>, а в прошедшем времени говорят просто <i>had</i>.</p><h3>Есть и «действия» с have</h3><p><i>have a rest</i> (отдохнуть), <i>have a look</i> (посмотреть), <i>have a break</i> (сделать перерыв), <i>have a party</i>, <i>have a good time</i>. В них нет значения «иметь».</p><h3>Прилагательные парами</h3><p>big — small · old — new · hot — cold · clean — dirty · light — dark · cheap — expensive · quiet — noisy · easy — difficult · good — bad. Учите парами: слово запоминается вместе с противоположным.</p><h3>Артикль зависит от следующего слова</h3><p><i>a big house</i>, но <i>an old house</i>: выбор a/an определяется <b>первым звуком слова, которое идёт сразу после артикля</b>, то есть прилагательного.</p><h3>Усилители и ослабители</h3><p><i>very</i> (очень), <i>really</i> (действительно очень), <i>quite</i> (довольно), <i>not very</i> (не очень = скорее маленький): <i>The flat isn’t very big.</i> Цвета тоже можно уточнять: <i>light blue, dark green</i>. Как прилагательные, цвета не меняются по числу: <i>red cars</i>.</p><p>Ещё ошибки: «a flat big», «a very much big flat» (нужно very big).</p><div class='tip err'><b>Частые ошибки:</b> «He have a flat» (нужно has), «She doesn’t has» (нужно doesn’t have), «a red big car» (нужно a big red car), «The rooms are bigs».</div>",

dl:"— Do you live in a house or in a flat?<br>— I live in a flat. It has two bedrooms, a big living room and a small balcony.<br>— Does it have a garden?<br>— No, it doesn’t, but there is a park near the house.<br>— Is it quiet?<br>— Yes, it’s very quiet.",
dt:"— Ты живёшь в доме или в квартире?<br>— Я живу в квартире. В ней две спальни, большая гостиная и небольшой балкон.<br>— Есть сад?<br>— Нет, но рядом с домом есть парк.<br>— Там тихо?<br>— Да, очень тихо.",
q:[{c:1,q:"She ___ a big flat.",o:["have","has","haves"],a:1,e:"she → has."},{c:1,q:"We ___ a garden. (у нас нет)",o:["don’t have","doesn’t have","don’t has"],a:0,e:"we → don’t have."},{c:1,q:"___ your flat have a balcony?",o:["Do","Does","Is"],a:1,e:"flat = it → Does."},{c:1,q:"Выберите верное:",o:["a red big car","a big red car","a red car big"],a:1,e:"Сначала размер, потом цвет."},{c:1,q:"The rooms ___.",o:["are bigs","are big","is big"],a:1,e:"Прилагательное не изменяется."},{c:1,q:"The kitchen is ___ small. (слишком)",o:["very","too","quite"],a:1,e:"too = слишком."},{t:1,q:"Переведите: У меня есть брат.",a:["i have a brother"],e:"I have a brother."},{t:1,q:"Переведите: У неё нет машины.",a:["she doesn’t have a car","she does not have a car"],e:"She doesn’t have a car."},{t:1,q:"Исправьте: He have two bedrooms.",a:["he has two bedrooms"],e:"he → has."},{t:1,q:"Исправьте: She doesn’t has a garden.",a:["she doesn’t have a garden","she does not have a garden"],e:"После doesn’t — have."},{t:1,q:"The flat ___ a balcony. (have)",a:["has"],e:"it → has."},{t:1,q:"Does she have a car? Ответьте «нет»: No, ___.",a:["she doesn’t","she does not"],e:"No, she doesn’t."}],
sp:"Опишите вслух свой дом: комнаты, что в них есть (I have… There is… It has…), какой он (big, small, cosy, quiet). 8 предложений.",rd:"We have a new flat. It has two bedrooms, a bright kitchen and a small bathroom. The living room is big and comfortable. The sofa is green and the walls are yellow. We don’t have a balcony, but we have a nice view of the river.",rt:"У нас новая квартира. В ней две спальни, светлая кухня и маленькая ванная. Гостиная большая и уютная. Диван зелёный, а стены жёлтые. Балкона у нас нет, но у нас красивый вид на реку."},
{t:"A1 · Юнит 12: Семья и описание людей",
ex:"<h3>Семья</h3><div class='wr'><table><tr><th>Слово</th><th>Значение</th><th>Слово</th><th>Значение</th></tr><tr><td>mother (mum)</td><td>мама</td><td>father (dad)</td><td>папа</td></tr><tr><td>sister</td><td>сестра</td><td>brother</td><td>брат</td></tr><tr><td>daughter</td><td>дочь</td><td>son</td><td>сын</td></tr><tr><td>grandmother</td><td>бабушка</td><td>grandfather</td><td>дедушка</td></tr><tr><td>aunt</td><td>тётя</td><td>uncle</td><td>дядя</td></tr><tr><td>cousin</td><td>двоюродный брат / сестра</td><td>parents</td><td>родители</td></tr></table></div><h3>Как описать внешность</h3><ul><li><b>be + прилагательное:</b> <i>He is tall. She is slim.</i> (tall — высокий, short — низкий, slim — стройный)</li><li><b>have / has + волосы и глаза:</b> <i>She <b>has</b> long dark hair and green eyes.</i> Не «She is long hair».</li><li>Порядок: длина → цвет: <i>long dark hair</i>. Тип волос: straight (прямые), curly (кудрявые).</li></ul><h3>Как описать характер</h3><p>kind (добрый), friendly (дружелюбный), clever (умный), shy (застенчивый), lazy (ленивый), serious (серьёзный), funny (смешной, весёлый). Конструкция та же: <i>My uncle is funny.</i></p><h3>Два разных вопроса: look like и be like</h3><div class='wr'><table><tr><th>Вопрос</th><th>Что спрашиваем</th><th>Ответ</th></tr><tr><td><b>What does she look like?</b></td><td>Как она выглядит?</td><td>She is tall and slim. She has long hair.</td></tr><tr><td><b>What is she like?</b></td><td>Какая она по характеру?</td><td>She is kind and funny.</td></tr><tr><td>What does she like?</td><td>Что ей нравится?</td><td>She likes music.</td></tr></table></div><ul><li>Сколько у вас родственников: <i>How many brothers do you have?</i> (how many + мн. число + do you have). Ответ: <i>I have two sisters and one brother.</i></li><li>Возраст: <i>How old is she? — She is 25.</i></li><li>Чьи родственники — используйте ’s из юнита 8: <i>my sister’s husband</i> (муж моей сестры).</li></ul><h3>Родство по браку и шире</h3><div class='wr'><table><tr><th>Слово</th><th>Значение</th></tr><tr><td>mother-in-law / father-in-law</td><td>тёща, свекровь / тесть, свёкор</td></tr><tr><td>brother-in-law / sister-in-law</td><td>зять, шурин, деверь / невестка, золовка</td></tr><tr><td>stepmother / stepfather / stepson</td><td>мачеха / отчим / пасынок</td></tr><tr><td>nephew / niece</td><td>племянник / племянница</td></tr><tr><td>grandson / granddaughter, grandchildren</td><td>внук / внучка, внуки</td></tr><tr><td>relatives, partner</td><td>родственники, партнёр</td></tr></table></div><p>В английском <b>cousin</b> подходит и для двоюродных братьев, и для сестёр, а <b>parents</b> — это мать и отец, но <b>relatives</b> — все родственники.</p><h3>Возраст: быть, а не иметь</h3><p><i>How old is he? — He is forty.</i> Нельзя говорить «He has forty years». Приблизительно: <i>about thirty</i>, <i>in his twenties</i> (ему двадцать с чем-то), <i>middle-aged</i> (средних лет), <i>elderly</i> (пожилой).</p><h3>Внешность подробнее</h3><ul><li>Волосы: <i>fair / blond hair</i> (светлые), <i>brown / black / grey hair</i>; <i>red hair</i> или <i>ginger hair</i> (рыжие). <i>He is bald</i> (лысый).</li><li>Лицо: <i>She has blue eyes. He has a beard / a moustache.</i> <i>He wears glasses.</i> (носит очки).</li><li>Телосложение: <i>slim, thin</i> (худой), <i>fat</i> (толстый — грубовато, лучше <i>big, overweight</i>), <i>strong, athletic</i>.</li></ul><h3>Look like и look + прилагательное</h3><p><i>She looks like her mother</i> — похожа на маму (<b>like</b> + существительное). <i>She looks tired</i> — выглядит усталой (<b>look</b> + прилагательное, без like). Не путайте: «She looks like tired».</p><p>Ещё ошибки: «He has forty years», «I have a sister more old» (нужно an older sister, сравнение придёт в A2).</p><div class='tip err'><b>Частые ошибки:</b> «She is long hair» (нужно has), «What does she like?», когда хотите спросить о характере (нужно What is she like?), «I have two sister» (нужно sisters).</div>",

q:[{c:1,q:"She ___ long hair.",o:["is","has","have"],a:1,e:"Волосы — has."},{c:1,q:"He ___ tall.",o:["has","is","have"],a:1,e:"Рост — is."},{c:1,q:"___ is she like? (о характере)",o:["What","How","Who"],a:0,e:"What is she like?"},{c:1,q:"___ does he look like? (о внешности)",o:["What","How","Which"],a:0,e:"What does he look like?"},{c:1,q:"She has ___ hair.",o:["dark long","long dark","long darks"],a:1,e:"Сначала длина, потом цвет."},{c:1,q:"How many sisters ___ you have?",o:["do","does","are"],a:0,e:"you → do."},{t:1,q:"Переведите: У меня две сестры.",a:["i have two sisters"],e:"I have two sisters."},{t:1,q:"Переведите: Он высокий и добрый.",a:["he is tall and kind","he’s tall and kind"],e:"He is tall and kind."},{t:1,q:"Исправьте: She is long hair.",a:["she has long hair"],e:"Волосы — has."},{t:1,q:"Спросите о характере: What does she like? — исправьте на правильный вопрос.",a:["what is she like"],e:"What is she like?"},{t:1,q:"Переведите: Это муж моей сестры.",a:["this is my sister’s husband","he is my sister’s husband","he’s my sister’s husband"],e:"my sister’s husband."},{t:1,q:"Переведите: Сколько у тебя братьев?",a:["how many brothers do you have"],e:"How many brothers do you have?"}],
sp:"Расскажите вслух о своей семье: кто в ней есть, как выглядит и какой по характеру один человек (10 предложений). Используйте has для волос и is для роста.",rd:"This is my family. My father is tall and he has short grey hair. My mother is slim and she has long dark hair. She is kind and funny. My brother looks like my father, but he is like my mother: he is friendly and always happy.",rt:"Это моя семья. Мой отец высокий, у него короткие седые волосы. Моя мама стройная, у неё длинные тёмные волосы. Она добрая и весёлая. Мой брат похож на отца, но по характеру он как мама: дружелюбный и всегда весёлый."},
{t:"A1 · Юнит 13: Город и дорога — как спросить и объяснить путь",
ex:"<h3>Повелительное наклонение (команды и указания)</h3><p>Для указаний нужна <b>начальная форма глагола без подлежащего и без to</b>: <i>Turn left.</i> — Поверните налево. Отрицание: <b>Don’t</b> + глагол: <i>Don’t turn right.</i> Вежливо: добавьте <b>please</b>: <i>Go straight on, please.</i></p><h3>Указания</h3><div class='wr'><table><tr><th>Фраза</th><th>Значение</th></tr><tr><td>Go straight on</td><td>Идите прямо</td></tr><tr><td>Turn left / right</td><td>Поверните налево / направо</td></tr><tr><td>Take the first / second turn</td><td>Свернитe в первый / второй поворот</td></tr><tr><td>Cross the road / the bridge</td><td>Перейдите дорогу / мост</td></tr><tr><td>at the traffic lights / at the corner</td><td>на светофоре / на углу</td></tr><tr><td>It’s on your left / on your right</td><td>Это слева / справа от вас</td></tr></table></div><h3>Предлоги движения</h3><ul><li><b>along</b> — вдоль: <i>Walk along the street.</i></li><li><b>across</b> — через (поверхность): <i>across the bridge</i></li><li><b>past</b> — мимо: <i>Go past the bank.</i></li><li><b>to</b> — к, в: <i>Go to the station.</i> · <b>into</b> — внутрь: <i>Go into the shop.</i></li></ul><h3>Порядковые числа</h3><p>Обычно число + <b>-th</b>: <i>fourth, sixth, tenth</i>. Исключения: <b>1st first, 2nd second, 3rd third, 5th fifth, 8th eighth, 9th ninth, 12th twelfth</b>.</p><h3>Вопросы о пути</h3><ul><li><b>How do I get to…?</b> — Как добраться до…? <i>How do I get to the station?</i></li><li><b>Where is…?</b> — Где…? · <b>Is it far?</b> — Это далеко? · <b>How far is it?</b> — Как далеко это? · <b>How long does it take?</b> — Сколько это занимает по времени?</li><li>Ответ: <i>It takes ten minutes. It’s about ten minutes on foot.</i> (on foot — пешком, by bus — на автобусе)</li><li>Начинайте вежливо: <i>Excuse me, …</i> Закончите: <i>Thank you very much!</i></li></ul><h3>Let’s — «давайте»</h3><p><b>Let’s + глагол</b> предлагает совместное действие: <i>Let’s go! Let’s take a taxi.</i> Отрицание: <i>Let’s not go.</i> Ответы: <i>Good idea! / OK. / Sorry, I can’t.</i></p><h3>Be в командах</h3><p>У глагола <b>to be</b> команда — <i>Be careful!</i> (Осторожно!), <i>Be quiet, please.</i> Отрицание: <i>Don’t be late!</i> (не <i>Not be late</i>).</p><h3>Британские и американские слова для города</h3><div class='wr'><table><tr><th>Британский</th><th>Американский</th><th>Значение</th></tr><tr><td>underground / tube</td><td>subway</td><td>метро</td></tr><tr><td>pavement</td><td>sidewalk</td><td>тротуар</td></tr><tr><td>chemist’s</td><td>pharmacy / drugstore</td><td>аптека</td></tr><tr><td>petrol station</td><td>gas station</td><td>заправка</td></tr><tr><td>car park</td><td>parking lot</td><td>парковка</td></tr><tr><td>crossroads</td><td>intersection</td><td>перекрёсток</td></tr><tr><td>roundabout</td><td>traffic circle</td><td>круговое движение</td></tr></table></div><h3>Ещё предлоги движения</h3><p><b>through</b> — сквозь (<i>through the park</i>), <b>over</b> — через, над (<i>over the bridge</i>), <b>under</b> — под (<i>under the bridge</i>), <b>up / down</b> — вверх / вниз по (<i>up the street, down the hill</i>), <b>towards</b> — по направлению к.</p><h3>Если вы не знаете дорогу</h3><p>Полезные фразы: <i>Sorry, I don’t know. I’m new here. Could you say that again, please? Could you speak more slowly? Is it far from here?</i> Попросите нарисовать: <i>Can you show me on the map?</i></p><p>Ещё ошибки: «Go on the street» (нужно along the street), «ten minutes by foot» (нужно on foot).</p><div class='tip err'><b>Частые ошибки:</b> «Turns left» (команда без -s), «Not turn right» (нужно Don’t turn), «go at the bridge» (across the bridge), «It is ten minutes» (нужно It takes ten minutes).</div>",

{t:"A1 · Юнит 14: Распорядок дня и частота действий",
ex:"<p>Здесь мы собираем Present Simple (юнит 3) и время (юнит 5) и добавляем способы рассказать о <b>последовательности</b> и <b>частоте</b>.</p><h3>Последовательность</h3><p><b>first</b> (сначала), <b>then</b> (потом), <b>after that</b> (после этого), <b>later</b> (позже), <b>finally</b> (наконец). <i>First I have a shower, then I have breakfast.</i> <b>before</b> (до, перед) и <b>after</b> (после) + существительное или -ing: <i>after work, before leaving</i>.</p><h3>Распорядок: что говорят</h3><ul><li><i>wake up</i> (просыпаться), <i>get up</i> (вставать), <i>have a shower / breakfast / lunch / dinner</i>, <i>brush my teeth</i> (чищу зубы), <i>go to work</i>, <i>start / finish work</i> (без артикля!), <i>come home</i>, <i>cook dinner</i>, <i>go to bed</i> (ложусь спать), <i>go to sleep</i> (засыпаю).</li><li>Нельзя: «go to the bed», «start the work» в значении «начать рабочий день». Правильно: <i>go to bed, start work</i>.</li></ul><h3>Как часто?</h3><div class='wr'><table><tr><th>Выражение</th><th>Значение</th></tr><tr><td>once a week</td><td>раз в неделю</td></tr><tr><td>twice a week</td><td>дважды в неделю</td></tr><tr><td>three times a month</td><td>три раза в месяц</td></tr><tr><td>every day / morning / week</td><td>каждый день / утро / неделю</td></tr><tr><td>on Mondays</td><td>по понедельникам</td></tr><tr><td>at the weekend</td><td>на выходных (в США on the weekend)</td></tr><tr><td>from nine to five</td><td>с девяти до пяти</td></tr></table></div><p>Вопросы: <b>How often do you…?</b> (как часто?), <b>What time do you…?</b> (во сколько?), <b>When do you…?</b> (когда?). Структура та же: вопросительное слово + do/does + подлежащее + глагол. <i>How often does she go to the gym? — Twice a week.</i></p><h3>Шкала частоты</h3><div class='wr'><table><tr><th>Слово</th><th>Примерно</th><th>Пример</th></tr><tr><td>always</td><td>100%</td><td>I always drink tea.</td></tr><tr><td>usually</td><td>80%</td><td>She usually walks.</td></tr><tr><td>often</td><td>60–70%</td><td>We often eat out.</td></tr><tr><td>sometimes</td><td>40%</td><td>He sometimes works late.</td></tr><tr><td>rarely / hardly ever</td><td>5–10%</td><td>I rarely watch TV.</td></tr><tr><td>never</td><td>0%</td><td>She never smokes.</td></tr></table></div><p>Позиция: <b>перед основным глаголом</b>, но <b>после to be</b> (<i>He is always late</i>). Слова <i>sometimes, usually, often</i> можно поставить в начало: <i>Sometimes I walk.</i> <i>Always</i> и <i>never</i> в начало обычно не ставят.</p><h3>Отрицание и частота</h3><p><i>I don’t always eat breakfast</i> — не всегда ем (иногда ем). <i>I never eat breakfast</i> — не ем никогда. Слова <b>never, rarely, hardly ever</b> уже содержат отрицание, поэтому второго not не нужно: <i>I never go</i>, не <i>I don’t never go</i>.</p><h3>Время суток и точность</h3><p><i>early</i> (рано) — <i>late</i> (поздно): <i>I get up early.</i> <i>on time</i> — вовремя, по расписанию: <i>The bus is on time.</i> <i>around seven</i> — около семи. <i>At noon</i> — в полдень, <i>at midnight</i> — в полночь.</p><h3>Глаголы распорядка</h3><p><i>get dressed</i> (одеваться), <i>have / take a shower</i> (США: take), <i>do the housework / homework</i> (домашние дела / задания), <i>go shopping</i>, <i>cook dinner</i>, <i>relax</i>, <i>check my email</i>, <i>go for a walk</i>. С едой используем <b>have</b>: <i>have breakfast</i>, а не <i>do breakfast</i>.</p><p>Ещё ошибки: «I go always to work» (нужно I always go), «I wake up on seven» (at seven), «I make a shower» (have / take), «I don’t never go» (I never go).</p><div class='tip err'><b>Частые ошибки:</b> «I go to the bed», «She go to bed» (нужно goes), «two times» вместо twice (допустимо, но twice естественнее), «How often you go…?» (нужен do).</div>",
